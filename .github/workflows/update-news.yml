name: Atualizar notícias do Radar Agro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        run: |

          python - <<'PY'

          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          # =====================================================
          # CONSULTAS DO RADAR AGRO
          # =====================================================

          queries = {

              "Brasil": [
                  "soybean Brazil",
                  "corn Brazil",
                  "coffee Brazil",
                  "sugar Brazil",
                  "beef Brazil",
                  "agriculture Brazil"
              ],

              "África": [
                  "cocoa Africa",
                  "coffee Africa",
                  "cotton Africa",
                  "corn Africa",
                  "wheat Africa",
                  "agriculture Africa"
              ],

              "China": [
                  "soybean China",
                  "corn China",
                  "wheat China",
                  "agriculture China",
                  "food China"
              ],

              "Estados Unidos": [
                  "soybean United States",
                  "corn United States",
                  "wheat United States",
                  "agriculture United States"
              ],

              "Argentina": [
                  "soybean Argentina",
                  "corn Argentina",
                  "wheat Argentina",
                  "agriculture Argentina"
              ],

              "Europa": [
                  "wheat Europe",
                  "grain Europe",
                  "agriculture Europe",
                  "food Europe",
                  "fertilizer Europe"
              ],

              "Índia": [
                  "rice India",
                  "sugar India",
                  "cotton India",
                  "agriculture India"
              ],

              "Austrália": [
                  "wheat Australia",
                  "grain Australia",
                  "agriculture Australia"
              ],

              "Rússia e Ucrânia": [
                  "wheat Russia",
                  "wheat Ukraine",
                  "grain Russia",
                  "grain Ukraine",
                  "fertilizer Russia",
                  "agriculture Ukraine"
              ],

              "Oriente Médio": [
                  "grain Middle East",
                  "food Middle East",
                  "fertilizer Middle East",
                  "agriculture Middle East"
              ],

              "América Latina": [
                  "soybean Latin America",
                  "corn Latin America",
                  "coffee Latin America",
                  "agriculture Latin America"
              ]
          }

          articles = []

          # =====================================================
          # FUNÇÃO DE BUSCA NO GDELT
          # =====================================================

          def search_gdelt(query, region):

              params = {
                  "query": query,
                  "mode": "artlist",
                  "format": "json",
                  "maxrecords": "20",
                  "timespan": "7d",
                  "sort": "datedesc"
              }

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 RadarAgroGlobal/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      raw = response.read().decode("utf-8")

                  data = json.loads(raw)

                  found = 0

                  for item in data.get("articles", []):

                      title = str(
                          item.get("title", "")
                      ).strip()

                      link = str(
                          item.get("url", "")
                      ).strip()

                      date = str(
                          item.get("seendate", "")
                      ).strip()

                      domain = str(
                          item.get("domain", "")
                      ).strip()

                      language = str(
                          item.get("language", "")
                      ).strip()

                      if not title or not link:
                          continue

                      articles.append({

                          "region": region,

                          "title": title,

                          "url": link,

                          "source": domain,

                          "date": date,

                          "language": language

                      })

                      found += 1

                  print(
                      "   Resultados:",
                      found
                  )

              except Exception as error:

                  print(
                      "   Erro:",
                      error
                  )


          # =====================================================
          # EXECUTAR TODAS AS BUSCAS
          # =====================================================

          for region, region_queries in queries.items():

              print("")
              print("========================================")
              print("REGIÃO:", region)
              print("========================================")

              for query in region_queries:

                  print(
                      "Buscando:",
                      query
                  )

                  search_gdelt(
                      query,
                      region
                  )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          unique = {}

          for article in articles:

              url = article.get("url", "").strip()

              if url:
                  unique[url] = article

          articles = list(
              unique.values()
          )


          # =====================================================
          # ORDENAR POR DATA
          # =====================================================

          articles.sort(
              key=lambda article:
                  article.get("date", ""),
              reverse=True
          )


          # =====================================================
          # LIMITAR RESULTADOS
          # =====================================================

          articles = articles[:150]


          # =====================================================
          # DATA DA ATUALIZAÇÃO
          # =====================================================

          now = datetime.now(
              timezone.utc
          ).isoformat()


          # =====================================================
          # GERAR ARQUIVO
          # =====================================================

          output = {

              "updated": now,

              "source": "GDELT",

              "count": len(articles),

              "news": articles

          }


          with open(
              "data/news-live.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RELATÓRIO
          # =====================================================

          print("")
          print("========================================")
          print("RADAR AGRO - ATUALIZAÇÃO CONCLUÍDA")
          print("========================================")
          print(
              "Total de notícias:",
              len(articles)
          )
          print(
              "Arquivo:",
              "data/news-live.json"
          )
          print("========================================")

          PY


      # =======================================================
      # SALVAR ARQUIVO ATUALIZADO
      # =======================================================

      - name: Salvar notícias atualizadas
        run: |

          git config user.name "Radar Agro Bot"

          git config user.email "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração nas notícias."

          else

            git commit -m "Atualizar notícias do Radar Agro"

            git push

          fi
