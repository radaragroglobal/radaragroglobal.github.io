name: Atualizar notícias do Radar Agro

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        shell: python
        run: |
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          OUTPUT = "data/news-live.json"

          # ============================================================
          # CONFIGURAÇÃO
          # ============================================================

          LANGUAGES = {
              "English": "english",
              "Portuguese": "portuguese",
              "Spanish": "spanish"
