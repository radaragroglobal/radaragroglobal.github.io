name: Atualizar notícias do Radar Agro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar e filtrar notícias
        run: |

          python - <<'PY'

          import json
          import urllib.parse
          import urllib.request
          import re
          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          MAX_NEWS = 150

          # Somente estes idiomas serão aceitos
          ALLOWED_LANGUAGES = {
              "English",
              "Portuguese",
              "Spanish"
          }


          # =====================================================
          # TERMOS DO AGRONEGÓCIO
          # =====================================================

          AGRO_TERMS = [

              # Português
              "agricultura",
              "agronegócio",
              "agro",
              "soja",
              "milho",
              "trigo",
              "café",
              "cacau",
              "açúcar",
              "algodão",
              "arroz",
              "carne",
              "bovino",
              "frango",
              "suíno",
              "fertilizante",
              "fertilizantes",
              "grãos",
              "safra",
              "plantio",
              "colheita",
              "exportação agrícola",
              "importação agrícola",
              "commodity",
              "commodities",
              "pecuária",
              "rural",
              "produtor rural",
              "clima agrícola",

              # Inglês
              "agriculture",
              "agribusiness",
              "agro",
              "soybean",
              "soybeans",
              "corn",
              "maize",
              "wheat",
              "coffee",
              "cocoa",
              "sugar",
              "cotton",
              "rice",
              "beef",
              "cattle",
              "chicken",
              "poultry",
              "pork",
              "fertilizer",
              "fertilizers",
              "grain",
              "grains",
              "harvest",
              "crop",
              "crops",
              "farming",
              "farmer",
              "commodity",
              "commodities",
              "livestock",
              "agricultural exports",
              "agricultural imports",

              # Espanhol
              "agricultura",
              "agronegocio",
              "agronegocio",
              "agro",
              "soja",
              "maíz",
              "trigo",
              "café",
              "cacao",
              "azúcar",
              "algodón",
              "arroz",
              "carne",
              "ganado",
              "pollo",
              "cerdo",
              "fertilizante",
              "fertilizantes",
              "grano",
              "granos",
              "cosecha",
              "cultivo",
              "agricultor",
              "agricultura",
              "productos agrícolas",
              "exportaciones agrícolas",
              "importaciones agrícolas"
          ]


          # =====================================================
          # COMMODITIES
          # =====================================================

          COMMODITIES = {

              "Soja": [
                  "soybean",
                  "soybeans",
                  "soja"
              ],

              "Milho": [
                  "corn",
                  "maize",
                  "milho",
                  "maíz"
              ],

              "Trigo": [
                  "wheat",
                  "trigo"
              ],

              "Café": [
                  "coffee",
                  "café"
              ],

              "Cacau": [
                  "cocoa",
                  "cacau",
                  "cacao"
              ],

              "Açúcar": [
                  "sugar",
                  "açúcar",
                  "azúcar"
              ],

              "Algodão": [
                  "cotton",
                  "algodão",
                  "algodón"
              ],

              "Arroz": [
                  "rice",
                  "arroz"
              ],

              "Carne bovina": [
                  "beef",
                  "cattle",
                  "carne bovina",
                  "carne de res",
                  "ganado"
              ],

              "Carne de frango": [
                  "chicken",
                  "poultry",
                  "frango",
                  "pollo"
              ],

              "Carne suína": [
                  "pork",
                  "suíno",
                  "cerdo"
              ],

              "Fertilizantes": [
                  "fertilizer",
                  "fertilizers",
                  "fertilizante",
                  "fertilizantes"
              ]
          }


          # =====================================================
          # REGIÕES
          # =====================================================

          REGION_TERMS = {

              "Brasil": [
                  "brazil",
                  "brasil",
                  "brasileiro",
                  "brasileira"
              ],

              "Estados Unidos": [
                  "united states",
                  "u.s.",
                  "usa",
                  "us agriculture",
                  "american agriculture"
              ],

              "China": [
                  "china",
                  "chinese"
              ],

              "Argentina": [
                  "argentina",
                  "argentine"
              ],

              "Índia": [
                  "india",
                  "indian"
              ],

              "Austrália": [
                  "australia",
                  "australian"
              ],

              "Europa": [
                  "europe",
                  "european",
                  "eu",
                  "european union"
              ],

              "Rússia e Ucrânia": [
                  "russia",
                  "russian",
                  "ukraine",
                  "ukrainian"
              ],

              "Oriente Médio": [
                  "middle east",
                  "middle eastern"
              ],

              "América Latina": [
                  "latin america",
                  "latin american"
              ],

              "África": [
                  "africa",
                  "african",
                  "ghana",
                  "nigeria",
                  "kenya",
                  "ethiopia",
                  "south africa",
                  "ivory coast",
                  "cote d'ivoire",
                  "côte d'ivoire",
                  "cameroon",
                  "uganda",
                  "tanzania",
                  "zambia",
                  "zimbabwe",
                  "mozambique",
                  "angola",
                  "senegal",
                  "mali",
                  "burkina faso",
                  "benin"
              ]
          }


          # =====================================================
          # CONSULTAS
          # =====================================================

          queries = [

              "soybean agriculture Brazil",
              "corn agriculture Brazil",
              "coffee agriculture Brazil",
              "sugar agriculture Brazil",
              "beef agriculture Brazil",
              "fertilizer Brazil agriculture",

              "soybean China agriculture",
              "corn China agriculture",
              "wheat China agriculture",

              "soybean United States agriculture",
              "corn United States agriculture",
              "wheat United States agriculture",

              "soybean Argentina agriculture",
              "corn Argentina agriculture",
              "wheat Argentina agriculture",

              "wheat Europe agriculture",
              "grain Europe agriculture",
              "fertilizer Europe agriculture",

              "rice India agriculture",
              "sugar India agriculture",
              "cotton India agriculture",

              "wheat Australia agriculture",
              "grain Australia agriculture",

              "wheat Russia agriculture",
              "wheat Ukraine agriculture",
              "fertilizer Russia agriculture",

              "cocoa Africa agriculture",
              "coffee Africa agriculture",
              "cotton Africa agriculture",
              "corn Africa agriculture",

              "grain Middle East agriculture",
              "fertilizer Middle East agriculture",

              "soybean Latin America agriculture",
              "corn Latin America agriculture",
              "coffee Latin America agriculture"
          ]


          articles = []


          # =====================================================
          # FUNÇÕES
          # =====================================================

          def normalize(text):

              text = str(text or "").lower()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def contains_term(text, terms):

              text = normalize(text)

              for term in terms:

                  if normalize(term) in text:
                      return True

              return False


          def detect_commodity(text):

              text = normalize(text)

              for commodity, terms in COMMODITIES.items():

                  for term in terms:

                      if normalize(term) in text:
                          return commodity

              return "Agricultura geral"


          def detect_region(text):

              text = normalize(text)

              scores = {}

              for region, terms in REGION_TERMS.items():

                  score = 0

                  for term in terms:

                      if normalize(term) in text:
                          score += 1

                  if score > 0:
                      scores[region] = score

              if not scores:
                  return "Global"

              return max(
                  scores,
                  key=scores.get
              )


          # =====================================================
          # BUSCAR GDELT
          # =====================================================

          for query in queries:

              print("")
              print("----------------------------------------")
              print("Consulta:", query)
              print("----------------------------------------")

              params = {
                  "query": query,
                  "mode": "artlist",
                  "format": "json",
                  "maxrecords": "20",
                  "timespan": "7d",
                  "sort": "datedesc"
              }

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + urllib.parse.urlencode(params)
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 RadarAgroGlobal/3.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                  data = json.loads(raw)

                  found = 0

                  for item in data.get(
                      "articles",
                      []
                  ):

                      title = str(
                          item.get(
                              "title",
                              ""
                          )
                      ).strip()

                      link = str(
                          item.get(
                              "url",
                              ""
                          )
                      ).strip()

                      date = str(
                          item.get(
                              "seendate",
                              ""
                          )
                      ).strip()

                      domain = str(
                          item.get(
                              "domain",
                              ""
                          )
                      ).strip()

                      language = str(
                          item.get(
                              "language",
                              ""
                          )
                      ).strip()

                      # -----------------------------------------
                      # CAMPOS OBRIGATÓRIOS
                      # -----------------------------------------

                      if not title or not link:
                          continue


                      # -----------------------------------------
                      # IDIOMA
                      # -----------------------------------------

                      if language not in ALLOWED_LANGUAGES:
                          continue


                      # -----------------------------------------
                      # TEXTO PARA ANÁLISE
                      # -----------------------------------------

                      text = (
                          title
                          + " "
                          + domain
                      )


                      # -----------------------------------------
                      # FILTRO AGRO
                      # -----------------------------------------

                      if not contains_term(
                          text,
                          AGRO_TERMS
                      ):
                          continue


                      # -----------------------------------------
                      # COMMODITY
                      # -----------------------------------------

                      commodity = detect_commodity(
                          text
                      )


                      # -----------------------------------------
                      # REGIÃO
                      # -----------------------------------------

                      region = detect_region(
                          text
                      )


                      # -----------------------------------------
                      # SALVAR
                      # -----------------------------------------

                      articles.append({

                          "region": region,

                          "commodity": commodity,

                          "language": language,

                          "title": title,

                          "url": link,

                          "source": domain,

                          "date": date

                      })

                      found += 1


                  print(
                      "Artigos aceitos:",
                      found
                  )


              except Exception as error:

                  print(
                      "Erro:",
                      error
                  )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          unique = {}

          for article in articles:

              url = article.get(
                  "url",
                  ""
              ).strip()

              if url:
                  unique[url] = article


          articles = list(
              unique.values()
          )


          # =====================================================
          # ORDENAR
          # =====================================================

          articles.sort(

              key=lambda article:
                  article.get(
                      "date",
                      ""
                  ),

              reverse=True
          )


          # =====================================================
          # LIMITE
          # =====================================================

          articles = articles[
              :MAX_NEWS
          ]


          # =====================================================
          # GERAR JSON
          # =====================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "GDELT",

              "count":
                  len(articles),

              "languages": [
                  "English",
                  "Portuguese",
                  "Spanish"
              ],

              "news":
                  articles
          }


          with open(
              "data/news-live.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESULTADO
          # =====================================================

          print("")
          print("========================================")
          print("RADAR AGRO")
          print("ATUALIZAÇÃO CONCLUÍDA")
          print("========================================")
          print(
              "Total de notícias:",
              len(articles)
          )
          print(
              "Idiomas:",
              "Português, Inglês e Espanhol"
          )
          print(
              "Limite:",
              MAX_NEWS
          )
          print("========================================")


          PY


      # =======================================================
      # SALVAR ALTERAÇÕES
      # =======================================================

      - name: Salvar notícias atualizadas
        run: |

          git config user.name "Radar Agro Bot"

          git config user.email "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração nas notícias."

          else

            git commit -m "Atualizar notícias agro"

            git push

          fi
