              ],
              "Fertilizantes": [
                  "fertilizer",
                  "fertilizers",
                  "fertiliser",
                  "fertilisers",
                  "fertilizante",
                  "fertilizantes"
              ]
          }

          # ============================================================
          # REGIÕES
          # ============================================================

          REGION_TERMS = {

              "Brasil": [
