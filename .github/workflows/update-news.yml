              "crop losses",
              "crop damage",
              "drought",
              "floods",
              "flooding",
              "frost",
              "heatwave",
              "drought affecting crops",
              "seca",
              "enchente",
              "enchentes",
              "geada",
              "onda de calor",
              "perdas agrícolas",
              "danos às lavouras",
              "sequía",
              "inundaciones",
              "helada",
              "pérdidas agrícolas"
          ]

          # ============================================================
          # REGIÕES
          # ============================================================

          REGIONS = {

              "Brasil": [
                  "Brazil",
                  "Brazilian",
                  "Brasil",
                  "brasileiro",
                  "brasileira",
                  "soja brasileira",
                  "milho brasileiro",
                  "agricultura brasileira",
                  "safra brasileira",
                  "exportações brasileiras"
              ],

              "África": [
                  "Africa",
                  "African",
                  "África",
                  "africano",
                  "africana",
                  "Nigeria",
                  "Kenya",
                  "Ethiopia",
                  "Ghana",
                  "Ivory Coast",
                  "Côte d'Ivoire",
                  "South Africa",
                  "Zambia",
                  "Zimbabwe",
                  "Tanzania",
                  "Uganda",
                  "Mozambique",
                  "Angola",
                  "Senegal",
                  "Mali",
                  "Burkina Faso",
                  "Cameroon",
                  "Benin",
                  "Ghanaian",
                  "Nigerian",
                  "Kenyan",
                  "Ethiopian"
              ],

              "Estados Unidos": [
                  "United States",
                  "US agriculture",
                  "U.S. agriculture",
                  "American agriculture",
                  "American farmers",
                  "US farmers",
                  "U.S. farmers",
                  "US soybean",
                  "US corn",
                  "US wheat"
              ],

              "China": [
                  "China",
                  "Chinese",
                  "Chinese agriculture",
                  "Chinese farmers",
                  "China soybean",
                  "China corn",
                  "China wheat",
                  "China imports"
              ],

              "Argentina": [
                  "Argentina",
                  "Argentine",
                  "Argentinean",
                  "Argentine agriculture",
                  "Argentine farmers",
                  "Argentine soybean",
                  "Argentine corn"
              ],

              "Índia": [
                  "India",
                  "Indian",
                  "Indian agriculture",
                  "Indian farmers",
                  "India soybean",
                  "India wheat",
                  "India rice",
                  "India sugar",
                  "Indian sugar"
              ],

              "Europa": [
                  "Europe",
                  "European",
                  "European Union",
                  "EU agriculture",
                  "EU farmers",
                  "European agriculture"
              ],

              "Rússia e Ucrânia": [
                  "Russia",
                  "Russian",
                  "Ukraine",
                  "Ukrainian",
                  "Black Sea grain",
                  "Black Sea agriculture",
                  "Russian wheat",
                  "Ukrainian grain",
                  "Ukraine grain exports",
                  "Russia grain exports"
              ],

              "Austrália": [
                  "Australia",
                  "Australian",
                  "Australian agriculture",
                  "Australian farmers",
                  "Australian wheat"
              ],

              "Oriente Médio": [
                  "Middle East",
                  "Middle Eastern",
                  "Gulf",
                  "Gulf countries",
                  "Saudi Arabia",
                  "Iran",
                  "Iraq",
                  "Israel",
                  "United Arab Emirates",
                  "UAE",
                  "Qatar",
                  "Jordan",
                  "Yemen",
                  "Oman"
              ],

              "América Latina": [
                  "Latin America",
                  "Latin American",
                  "Mexico",
                  "Mexican",
                  "Colombia",
                  "Colombian",
                  "Chile",
                  "Chilean",
                  "Peru",
                  "Peruvian",
                  "Paraguay",
                  "Uruguay",
                  "Bolivia",
                  "Ecuador",
                  "Central America"
              ]
          }

          # ============================================================
          # COMMODITIES
          # ============================================================

          COMMODITIES = {
              "Soja": [
                  "soybean",
                  "soybeans",
                  "soja",
                  "soy"
              ],
              "Milho": [
                  "corn",
                  "maize",
                  "milho",
                  "maíz"
              ],
              "Trigo": [
                  "wheat",
                  "trigo",
              ],
              "Arroz": [
                  "rice",
                  "arroz"
              ],
              "Café": [
                  "coffee",
                  "café"
              ],
              "Cacau": [
                  "cocoa",
                  "cacao",
                  "cacau"
              ],
              "Açúcar": [
                  "sugar",
                  "sugarcane",
                  "açúcar",
                  "cana-de-açúcar",
                  "azúcar",
                  "caña de azúcar"
              ],
              "Algodão": [
                  "cotton",
                  "algodão",
                  "algodón"
              ],
              "Carne bovina": [
                  "beef",
                  "cattle",
                  "livestock",
                  "carne bovina",
                  "gado",
                  "carne vacuna",
                  "ganado"
              ],
              "Frango": [
                  "poultry",
                  "chicken",
                  "frango",
                  "pollo"
              ],
              "Carne suína": [
                  "pork",
                  "swine",
                  "suínos",
                  "suinocultura",
                  "cerdo",
                  "porcino"
              ],
              "Fertilizantes": [
                  "fertilizer",
                  "fertilizers",
                  "fertiliser",
                  "fertilisers",
                  "fertilizante",
                  "fertilizantes"
              ]
          }

          # ============================================================
          # FUNÇÕES
          # ============================================================

          def normalize(text):
              text = str(text or "").lower()
              text = re.sub(r"\s+", " ", text)
              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              return text.strip()

          def contains_agro_term(text):
              normalized = normalize(text)

              for term in AGRO_TERMS:
                  term_normalized = normalize(term)

                  if len(term_normalized) < 4:
                      continue

                  if term_normalized in normalized:
                      return True

              return False

          def detect_commodity(text):
              normalized = normalize(text)

              found = []

              for commodity, terms in COMMODITIES.items():
                  for term in terms:
                      if normalize(term) in normalized:
                          found.append(commodity)
                          break

              return found

          def detect_region(text):
              normalized = normalize(text)

              matches = []

              for region, terms in REGIONS.items():

                  score = 0

                  for term in terms:
                      t = normalize(term)

                      if len(t) < 4:
                          continue

                      if t in normalized:
                          score += 1

                  if score > 0:
                      matches.append((score, region))

              if not matches:
                  return None

              matches.sort(reverse=True)

              return matches[0][1]

          def forbidden_script(text):
              """
              Bloqueia idiomas que não fazem parte do projeto.
              """

              if not text:
                  return True

              # Chinês / japonês
              if re.search(r"[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]", text):
                  return True

              # Coreano
              if re.search(r"[\uac00-\ud7af]", text):
                  return True

              # Árabe
              if re.search(r"[\u0600-\u06ff]", text):
                  return True

              # Hebraico
              if re.search(r"[\u0590-\u05ff]", text):
                  return True

              # Cirílico
              if re.search(r"[\u0400-\u04ff]", text):
                  return True

              # Grego
              if re.search(r"[\u0370-\u03ff]", text):
                  return True

              # Devanagari
              if re.search(r"[\u0900-\u097f]", text):
                  return True

              # Bengali
              if re.search(r"[\u0980-\u09ff]", text):
                  return True

              # Gujarati
              if re.search(r"[\u0a80-\u0aff]", text):
                  return True

              # Thai
              if re.search(r"[\u0e00-\u0e7f]", text):
                  return True

              return False

          def normalize_title(title):
              title = normalize(title)

              # Remove palavras muito comuns para melhorar deduplicação
              stopwords = {
                  "the", "a", "an", "of", "and", "to",
                  "o", "a", "os", "as", "de", "da", "do",
                  "e", "para",
                  "el", "la", "los", "las", "de", "del", "y"
              }

              words = [
                  word for word in title.split()
                  if word not in stopwords
              ]

              return " ".join(words)

          def fetch_gdelt(query):

              encoded = urllib.parse.quote(query)

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=50"
                  "&timespan=3d"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadarAgroGlobal/1.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read().decode("utf-8")

                  return json.loads(data)

              except Exception as e:
                  print("Erro GDELT:", e)
                  return {"articles": []}

          # ============================================================
          # CONSULTAS
          # ============================================================

          # Vamos fazer consultas específicas por região + idioma.
          #
          # Importante:
          # sourcelang limita a língua da fonte.
          # Os termos regionais evitam que uma notícia seja atribuída
          # arbitrariamente a outra região.
          #

          region_queries = {

              "Brasil": [
                  '"Brazil" agriculture',
                  '"Brazil" soybean',
                  '"Brazil" corn',
                  '"Brazil" coffee',
                  '"Brazil" cattle',
                  '"Brazil" fertilizer',
                  '"Brasil" agricultura',
                  '"Brasil" soja',
                  '"Brasil" milho',
                  '"Brasil" café',
                  '"Brasil" pecuária',
                  '"Brasil" fertilizantes'
              ],

              "África": [
                  '"Africa" agriculture',
                  '"Africa" farming',
                  '"Africa" crops',
                  '"Africa" cocoa',
                  '"Africa" cotton',
                  '"Africa" food security',
                  '"Africa" fertilizer',
                  '"África" agricultura',
                  '"África" cacau',
                  '"África" algodão'
              ],

              "Estados Unidos": [
                  '"United States" agriculture',
                  '"US" soybean',
                  '"US" corn',
                  '"US" wheat',
                  '"American farmers" agriculture',
                  '"US agriculture" commodities'
              ],

              "China": [
                  '"China" agriculture',
                  '"China" soybean',
                  '"China" corn',
                  '"China" wheat',
                  '"China" agricultural imports',
                  '"Chinese farmers" agriculture'
              ],

              "Argentina": [
                  '"Argentina" agriculture',
                  '"Argentina" soybean',
                  '"Argentina" corn',
                  '"Argentina" wheat',
                  '"Argentine farmers"'
              ],

              "Índia": [
                  '"India" agriculture',
                  '"India" soybean',
                  '"India" wheat',
                  '"India" rice',
                  '"India" sugar',
                  '"Indian farmers"'
              ],

              "Europa": [
                  '"European Union" agriculture',
                  '"EU" agriculture',
                  '"Europe" farmers',
                  '"European agriculture"',
                  '"EU agricultural exports"'
              ],

              "Rússia e Ucrânia": [
                  '"Russia" agriculture',
                  '"Russia" wheat',
                  '"Russia" grain exports',
                  '"Ukraine" agriculture',
                  '"Ukraine" grain',
                  '"Ukraine" grain exports',
                  '"Black Sea" grain'
              ],

              "Austrália": [
                  '"Australia" agriculture',
                  '"Australian farmers"',
                  '"Australia" wheat',
                  '"Australia" grain'
              ],

              "Oriente Médio": [
                  '"Middle East" agriculture',
                  '"Middle East" food security',
                  '"Middle East" grain',
                  '"Saudi Arabia" agriculture',
                  '"Iran" agriculture',
                  '"UAE" agriculture'
              ],

              "América Latina": [
                  '"Latin America" agriculture',
                  '"Latin America" soybean',
                  '"Mexico" agriculture',
                  '"Colombia" agriculture',
                  '"Paraguay" agriculture',
                  '"Uruguay" agriculture',
                  '"Chile" agriculture'
              ]
          }

          # ============================================================
          # COLETA
          # ============================================================

          collected = []

          for region, queries in region_queries.items():

              for language_name, language_code in LANGUAGES.items():

                  for base_query in queries:

                      # O idioma é obrigatório na busca.
                      query = (
                          f"({base_query}) "
                          f"sourcelang:{language_code}"
                      )

                      print("Buscando:", region, language_name, query)

                      data = fetch_gdelt(query)

                      articles = data.get("articles", [])

                      for article in articles:

                          title = article.get("title", "").strip()
                          url = article.get("url", "").strip()
                          source = article.get("domain", "").strip()
                          date = article.get("seendate", "").strip()

                          if not title or not url:
                              continue

                          # ==================================================
                          # FILTRO DE IDIOMA
                          # ==================================================

                          if forbidden_script(title):
                              continue

                          # ==================================================
                          # FILTRO AGRO
                          # ==================================================

                          if not contains_agro_term(title):
                              continue

                          # ==================================================
                          # REGIÃO
                          # ==================================================

                          detected = detect_region(title)

                          # A notícia precisa mencionar explicitamente
                          # a região/país ou um termo equivalente.
                          if detected != region:
                              continue

                          # ==================================================
                          # COMMODITIES
                          # ==================================================

                          commodities = detect_commodity(title)

                          # ==================================================
                          # DEDUPLICAÇÃO
                          # ==================================================

                          normalized = normalize_title(title)

                          if not normalized:
                              continue

                          collected.append({
                              "region": region,
                              "title": title,
                              "url": url,
                              "source": source,
                              "date": date,
                              "language": language_name,
                              "commodities": commodities,
                              "_key": normalized
                          })

          # ============================================================
          # DEDUPLICAR
          # ============================================================

          unique = {}

          for item in collected:

              key = item["_key"]

              # Se o mesmo título apareceu em vários sites,
              # mantemos apenas o primeiro.
              if key not in unique:
                  unique[key] = item

          news = list(unique.values())

          # ============================================================
          # ORDENAR POR DATA
          # ============================================================

          news.sort(
              key=lambda x: x.get("date", ""),
              reverse=True
          )

          # Remover campo interno
          for item in news:
              item.pop("_key", None)

          # ============================================================
          # LIMITE
          # ============================================================

          news = news[:150]

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_count = {}

          region_count = {}

          for item in news:

              lang = item.get("language", "Unknown")
              reg = item.get("region", "Unknown")

              language_count[lang] = language_count.get(lang, 0) + 1
              region_count[reg] = region_count.get(reg, 0) + 1

          # ============================================================
          # SALVAR
          # ============================================================

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "source": "GDELT",
              "count": len(news),
              "languages": language_count,
              "regions": region_count,
              "news": news
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("======================================")
          print("Radar Agro atualizado")
          print("Total:", len(news))
          print("Idiomas:", language_count)
          print("Regiões:", region_count)
          print("======================================")

      - name: Verificar arquivo
        run: |
          echo "Conteúdo inicial do arquivo:"
          head -40 data/news-live.json

      - name: Salvar alterações
        run: |
          git config user.name "Radar Agro Global"
          git config user.email "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar notícias agro automaticamente"
            git push
          fi
