name: Atualizar notícias do Radar Agro

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Impede duas execuções de alterarem o mesmo arquivo ao mesmo tempo.
concurrency:
  group: radar-agro-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        shell: python
        run: |

          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          OUTPUT = "data/news-live.json"

          # ========================================================
          # IDIOMAS PERMITIDOS
          # ========================================================

          LANGUAGES = {
              "English": "english",
              "Portuguese": "portuguese",
              "Spanish": "spanish"
          }

          ALLOWED_GDELT_LANGUAGES = {
              "English",
              "Portuguese",
              "Spanish"
          }

          # ========================================================
          # TERMOS AGRO
          # ========================================================

          AGRO_STRONG_TERMS = [

              # Inglês
              "agriculture",
              "agricultural",
              "farmer",
              "farmers",
              "farming",
              "farm",
              "crop",
              "crops",
              "harvest",
              "planting",
              "soybean",
              "soybeans",
              "corn",
              "maize",
              "wheat",
              "rice",
              "cotton",
              "coffee",
              "cocoa",
              "cacao",
              "sugar",
              "sugarcane",
              "beef",
              "cattle",
              "livestock",
              "poultry",
              "chicken",
              "pork",
              "swine",
              "fertilizer",
              "fertilizers",
              "fertiliser",
              "fertilisers",
              "grain",
              "grains",
              "crop losses",
              "crop damage",
              "grain exports",
              "grain shipments",
              "agricultural exports",
              "agricultural imports",
              "food prices",

              # Português
              "agricultura",
              "agrícola",
              "agricultor",
              "agricultores",
              "agropecuária",
              "agropecuário",
              "lavoura",
              "lavouras",
              "safra",
              "safras",
              "plantio",
              "colheita",
              "soja",
              "milho",
              "trigo",
              "arroz",
              "algodão",
              "café",
              "cacau",
              "açúcar",
              "cana-de-açúcar",
              "gado",
              "pecuária",
              "carne bovina",
              "frango",
              "suínos",
              "suinocultura",
              "fertilizante",
              "fertilizantes",
              "grãos",
              "perdas agrícolas",
              "danos às lavouras",
              "exportações agrícolas",
              "importações agrícolas",
              "preços agrícolas",
              "preços de alimentos",

              # Espanhol
              "agricultura",
              "agrícola",
              "agricultor",
              "agricultores",
              "agropecuario",
              "agropecuaria",
              "cultivo",
              "cultivos",
              "cosecha",
              "cosechas",
              "siembra",
              "soja",
              "maíz",
              "trigo",
              "arroz",
              "algodón",
              "café",
              "cacao",
              "azúcar",
              "caña de azúcar",
              "ganado",
              "ganadería",
              "carne vacuna",
              "pollo",
              "cerdo",
              "porcino",
              "fertilizante",
              "fertilizantes",
              "grano",
              "granos",
              "pérdidas agrícolas",
              "exportaciones agrícolas",
              "importaciones agrícolas",
              "precios agrícolas",
              "precios de alimentos"
          ]

          # ========================================================
          # COMMODITIES
          # ========================================================

          COMMODITIES = {

              "Soja": [
                  "soybean",
                  "soybeans",
                  "soy",
                  "soja"
              ],

              "Milho": [
                  "corn",
                  "maize",
                  "milho",
                  "maíz"
              ],

              "Trigo": [
                  "wheat",
                  "trigo"
              ],

              "Arroz": [
                  "rice",
                  "arroz"
              ],

              "Café": [
                  "coffee",
                  "café"
              ],

              "Cacau": [
                  "cocoa",
                  "cacao",
                  "cacau"
              ],

              "Açúcar": [
                  "sugar",
                  "sugarcane",
                  "açúcar",
                  "cana de açúcar",
                  "azúcar",
                  "caña de azúcar"
              ],

              "Algodão": [
                  "cotton",
                  "algodão",
                  "algodón"
              ],

              "Carne bovina": [
                  "beef",
                  "cattle",
                  "livestock",
                  "carne bovina",
                  "gado",
                  "carne vacuna",
                  "ganado"
              ],

              "Frango": [
                  "poultry",
                  "chicken",
                  "frango",
                  "pollo"
              ],

              "Carne suína": [
                  "pork",
                  "swine",
                  "suínos",
                  "suinocultura",
                  "cerdo",
                  "porcino"
              ],

              "Fertilizantes": [
                  "fertilizer",
                  "fertilizers",
                  "fertiliser",
                  "fertilisers",
                  "fertilizante",
                  "fertilizantes"
              ]
          }

          # ========================================================
          # REGIÕES
          # ========================================================

          REGIONS = {

              "Brasil": [
                  "brazil",
                  "brazilian",
                  "brasil",
                  "brasileiro",
                  "brasileira",
                  "são paulo",
                  "sao paulo",
                  "paraná",
                  "parana",
                  "mato grosso",
                  "goiás",
                  "goias",
                  "minas gerais",
                  "bahia",
                  "rio grande do sul"
              ],

              "África": [
                  "africa",
                  "african",
                  "áfrica",
                  "africano",
                  "africana",
                  "nigeria",
                  "nigerian",
                  "kenya",
                  "kenyan",
                  "ethiopia",
                  "ethiopian",
                  "ghana",
                  "ghanaian",
                  "ivory coast",
                  "côte d'ivoire",
                  "south africa",
                  "south african",
                  "zambia",
                  "zimbabwe",
                  "tanzania",
                  "uganda",
                  "mozambique",
                  "angola",
                  "senegal",
                  "mali",
                  "burkina faso",
                  "cameroon",
                  "benin"
              ],

              "Estados Unidos": [
                  "united states",
                  "u.s. agriculture",
                  "u.s. farmers",
                  "american agriculture",
                  "american farmers",
                  "american soybean",
                  "american corn",
                  "american wheat"
              ],

              "China": [
                  "china",
                  "chinese",
                  "chinese agriculture",
                  "chinese farmers",
                  "china soybean",
                  "china corn",
                  "china wheat",
                  "china imports"
              ],

              "Argentina": [
                  "argentina",
                  "argentine",
                  "argentinean",
                  "argentine agriculture",
                  "argentine farmers",
                  "argentine soybean",
                  "argentine corn",
                  "argentine wheat"
              ],

              "Índia": [
                  "india",
                  "indian",
                  "indian agriculture",
                  "indian farmers",
                  "india soybean",
                  "india wheat",
                  "india rice",
                  "india sugar"
              ],

              "Europa": [
                  "europe",
                  "european",
                  "european union",
                  "eu agriculture",
                  "eu farmers",
                  "european agriculture"
              ],

              "Rússia e Ucrânia": [
                  "russia",
                  "russian",
                  "ukraine",
                  "ukrainian",
                  "black sea grain",
                  "black sea agriculture",
                  "russian wheat",
                  "ukrainian grain",
                  "ukraine grain exports",
                  "russia grain exports"
              ],

              "Austrália": [
                  "australia",
                  "australian",
                  "australian agriculture",
                  "australian farmers",
                  "australian wheat",
                  "australian grain"
              ],

              "Oriente Médio": [
                  "middle east",
                  "middle eastern",
                  "gulf countries",
                  "saudi arabia",
                  "iran",
                  "iraq",
                  "israel",
                  "united arab emirates",
                  "uae",
                  "qatar",
                  "jordan",
                  "yemen",
                  "oman"
              ],

              "América Latina": [
                  "latin america",
                  "latin american",
                  "mexico",
                  "mexican",
                  "colombia",
                  "colombian",
                  "chile",
                  "chilean",
                  "peru",
                  "peruvian",
                  "paraguay",
                  "uruguay",
                  "bolivia",
                  "ecuador"
              ]
          }

          # ========================================================
          # CONSULTAS
          #
          # Uma consulta por região + idioma.
          # Isso reduz drasticamente o tempo do workflow.
          # ========================================================

          REGION_QUERIES = {

              "Brasil":
                  '("Brazil" OR "Brazilian" OR "Brasil") '
                  'AND (agriculture OR soybean OR corn OR coffee OR cattle OR fertilizer)',

              "África":
                  '("Africa" OR "African" OR Nigeria OR Kenya OR Ethiopia OR Ghana OR '
                  '"South Africa" OR Zambia OR Zimbabwe OR Tanzania OR Uganda) '
                  'AND (agriculture OR farming OR crops OR cocoa OR cotton OR fertilizer)',

              "Estados Unidos":
                  '("United States" OR "U.S. agriculture" OR "American farmers") '
                  'AND (agriculture OR soybean OR corn OR wheat OR cattle OR farming)',

              "China":
                  '("China" OR "Chinese") '
                  'AND (agriculture OR soybean OR corn OR wheat OR rice OR farming)',

              "Argentina":
                  '("Argentina" OR "Argentine") '
                  'AND (agriculture OR soybean OR corn OR wheat OR farming)',

              "Índia":
                  '("India" OR "Indian") '
                  'AND (agriculture OR soybean OR wheat OR rice OR sugar OR farming)',

              "Europa":
                  '("European Union" OR "European" OR "Europe") '
                  'AND (agriculture OR farming OR crops OR wheat OR grain OR fertilizer)',

              "Rússia e Ucrânia":
                  '("Russia" OR "Russian" OR "Ukraine" OR "Ukrainian" OR "Black Sea") '
                  'AND (agriculture OR wheat OR grain OR farming OR crops)',

              "Austrália":
                  '("Australia" OR "Australian") '
                  'AND (agriculture OR farming OR wheat OR grain OR crops)',

              "Oriente Médio":
                  '("Middle East" OR "Saudi Arabia" OR Iran OR Iraq OR Israel OR UAE OR Qatar) '
                  'AND (agriculture OR farming OR grain OR food security)',

              "América Latina":
                  '("Latin America" OR Mexico OR Colombia OR Chile OR Peru OR Paraguay OR Uruguay) '
                  'AND (agriculture OR farming OR soybean OR corn OR coffee OR crops)'
          }

          # ========================================================
          # NORMALIZAÇÃO
          # ========================================================

          def normalize(text):

              text = str(text or "").lower()

              text = text.replace("&amp;", " and ")

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^\w\s]",
                  " ",
                  text,
                  flags=re.UNICODE
              )

              return text.strip()

          # ========================================================
          # BLOQUEAR ESCRITAS DE IDIOMAS NÃO PERMITIDOS
          # ========================================================

          def contains_forbidden_script(text):

              if not text:
                  return True

              # Chinês / japonês
              if re.search(
                  r"[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]",
                  text
              ):
                  return True

              # Coreano
              if re.search(
                  r"[\uac00-\ud7af]",
                  text
              ):
                  return True

              # Árabe
              if re.search(
                  r"[\u0600-\u06ff]",
                  text
              ):
                  return True

              # Hebraico
              if re.search(
                  r"[\u0590-\u05ff]",
                  text
              ):
                  return True

              # Cirílico
              if re.search(
                  r"[\u0400-\u04ff]",
                  text
              ):
                  return True

              # Grego
              if re.search(
                  r"[\u0370-\u03ff]",
                  text
              ):
                  return True

              # Devanagari
              if re.search(
                  r"[\u0900-\u097f]",
                  text
              ):
                  return True

              # Bengali
              if re.search(
                  r"[\u0980-\u09ff]",
                  text
              ):
                  return True

              # Gujarati
              if re.search(
                  r"[\u0a80-\u0aff]",
                  text
              ):
                  return True

              # Thai
              if re.search(
                  r"[\u0e00-\u0e7f]",
                  text
              ):
                  return True

              return False

          # ========================================================
          # VERIFICAR SE É REALMENTE AGRO
          # ========================================================

          def agro_matches(title):

              normalized = normalize(title)

              matches = []

              for term in AGRO_STRONG_TERMS:

                  t = normalize(term)

                  if len(t) < 4:
                      continue

                  if t in normalized:
                      matches.append(t)

              return matches

          # ========================================================
          # DETECTAR COMMODITIES
          # ========================================================

          def detect_commodity(title):

              normalized = normalize(title)

              found = []

              for commodity, terms in COMMODITIES.items():

                  for term in terms:

                      t = normalize(term)

                      if t and t in normalized:

                          found.append(commodity)

                          break

              return found

          # ========================================================
          # DETECTAR REGIÃO
          # ========================================================

          def detect_region(title):

              normalized = normalize(title)

              candidates = []

              for region, terms in REGIONS.items():

                  score = 0

                  for term in terms:

                      t = normalize(term)

                      if len(t) < 4:
                          continue

                      if t in normalized:

                          # Expressões com mais de uma palavra
                          # recebem maior peso.
                          if len(t.split()) >= 2:
                              score += 3
                          else:
                              score += 1

                  if score > 0:

                      candidates.append(
                          (score, region)
                      )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              return candidates[0][1]

          # ========================================================
          # NORMALIZAR TÍTULO PARA DEDUPLICAÇÃO
          # ========================================================

          def normalize_title(title):

              title = normalize(title)

              stopwords = {
                  "the", "a", "an", "of", "and", "to",
                  "in", "on", "for", "with", "from",
                  "o", "a", "os", "as", "de", "da", "do",
                  "e", "para", "em", "com", "por",
                  "el", "la", "los", "las", "de", "del",
                  "y", "en", "con", "por"
              }

              words = [
                  word
                  for word in title.split()
                  if word not in stopwords
              ]

              return " ".join(words)

          # ========================================================
          # GDELT
          # ========================================================

          def fetch_gdelt(query):

              encoded = urllib.parse.quote(query)

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=40"
                  "&timespan=3d"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "RadarAgroGlobal/3.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                  return json.loads(raw)

              except Exception as error:

                  print(
                      "Erro GDELT:",
                      error
                  )

                  return {
                      "articles": []
                  }

          # ========================================================
          # COLETA
          # ========================================================

          collected = []

          for region, base_query in REGION_QUERIES.items():

              for language_name, language_code in LANGUAGES.items():

                  query = (
                      f"({base_query}) "
                      f"sourcelang:{language_code}"
                  )

                  print("")
                  print(
                      "======================================"
                  )
                  print(
                      "REGIÃO:",
                      region
                  )
                  print(
                      "IDIOMA:",
                      language_name
                  )
                  print(
                      "QUERY:",
                      query
                  )
                  print(
                      "======================================"
                  )

                  data = fetch_gdelt(query)

                  articles = data.get(
                      "articles",
                      []
                  )

                  for article in articles:

                      title = str(
                          article.get(
                              "title",
                              ""
                          )
                      ).strip()

                      url = str(
                          article.get(
                              "url",
                              ""
                          )
                      ).strip()

                      source = str(
                          article.get(
                              "domain",
                              ""
                          )
                      ).strip()

                      date = str(
                          article.get(
                              "seendate",
                              ""
                          )
                      ).strip()

                      article_language = str(
                          article.get(
                              "language",
                              ""
                          )
                      ).strip()

                      if not title or not url:
                          continue

                      # ==================================================
                      # IDIOMA
                      # ==================================================

                      if article_language:

                          if article_language not in ALLOWED_GDELT_LANGUAGES:

                              print(
                                  "Idioma rejeitado:",
                                  article_language,
                                  title
                              )

                              continue

                      # ==================================================
                      # ESCRITA
                      # ==================================================

                      if contains_forbidden_script(title):

                          continue

                      # ==================================================
                      # AGRO
                      # ==================================================

                      agro = agro_matches(title)

                      if not agro:

                          continue

                      # ==================================================
                      # REGIÃO
                      # ==================================================

                      detected = detect_region(title)

                      if detected != region:

                          continue

                      # ==================================================
                      # COMMODITIES
                      # ==================================================

                      commodities = detect_commodity(
                          title
                      )

                      # ==================================================
                      # PONTUAÇÃO
                      # ==================================================

                      score = 0

                      score += len(agro) * 2

                      score += len(commodities) * 3

                      if len(title) >= 50:
                          score += 1

                      if len(title) >= 90:
                          score += 1

                      # Fontes com domínio reconhecido
                      # recebem pequena prioridade.
                      trusted_domains = {

                          "reuters.com",
                          "apnews.com",
                          "bbc.com",
                          "bbc.co.uk",
                          "ft.com",
                          "bloomberg.com",
                          "cnbc.com",
                          "agriland.ie",
                          "farmersweekly.co.uk",
                          "fao.org",
                          "worldbank.org",
                          "usda.gov",
                          "gov.br",
                          "embrapa.br",
                          "globorural.globo.com",
                          "canalrural.com.br",
                          "noticiasagricolas.com.br"
                      }

                      domain = source.lower()

                      if any(
                          domain == trusted
                          or domain.endswith(
                              "." + trusted
                          )
                          for trusted in trusted_domains
                      ):

                          score += 4

                      # ==================================================
                      # DEDUPLICAÇÃO
                      # ==================================================

                      key = normalize_title(
                          title
                      )

                      if not key:
                          continue

                      collected.append({

                          "region": region,

                          "title": title,

                          "url": url,

                          "source": source,

                          "date": date,

                          "language": language_name,

                          "commodities": commodities,

                          "_score": score,

                          "_key": key
                      })

          # ============================================================
          # DEDUPLICAÇÃO FINAL
          # ============================================================

          unique = {}

          for item in collected:

              key = item["_key"]

              if key not in unique:

                  unique[key] = item

              else:

                  if item["_score"] > unique[key]["_score"]:

                      unique[key] = item

          news = list(
              unique.values()
          )

          # ============================================================
          # ORDENAR POR RELEVÂNCIA E DATA
          # ============================================================

          news.sort(
              key=lambda item: (
                  item.get("_score", 0),
                  item.get("date", "")
              ),
              reverse=True
          )

          # ============================================================
          # LIMITE POR REGIÃO
          #
          # Evita que China/EUA/etc. ocupem todas as notícias.
          # ============================================================

          balanced = []

          region_count_temp = {}

          for item in news:

              region = item["region"]

              current = region_count_temp.get(
                  region,
                  0
              )

              if current >= 15:
                  continue

              balanced.append(
                  item
              )

              region_count_temp[region] = (
                  current + 1
              )

          news = balanced[:150]

          # ============================================================
          # REMOVER CAMPOS INTERNOS
          # ============================================================

          for item in news:

              item.pop(
                  "_score",
                  None
              )

              item.pop(
                  "_key",
                  None
              )

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_count = {}

          region_count = {}

          commodity_count = {}

          for item in news:

              language = item.get(
                  "language",
                  "Unknown"
              )

              region = item.get(
                  "region",
                  "Unknown"
              )

              language_count[language] = (
                  language_count.get(
                      language,
                      0
                  ) + 1
              )

              region_count[region] = (
                  region_count.get(
                      region,
                      0
                  ) + 1
              )

              for commodity in item.get(
                  "commodities",
                  []
              ):

                  commodity_count[commodity] = (
                      commodity_count.get(
                          commodity,
                          0
                      ) + 1
                  )

          # ============================================================
          # SAÍDA
          # ============================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "GDELT",

              "count":
                  len(news),

              "languages":
                  language_count,

              "regions":
                  region_count,

              "commodities":
                  commodity_count,

              "news":
                  news
          }

          # ============================================================
          # SALVAR
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # LOG FINAL
          # ============================================================

          print("")
          print(
              "======================================"
          )
          print(
              "RADAR AGRO ATUALIZADO"
          )
          print(
              "Total:",
              len(news)
          )
          print(
              "Idiomas:",
              language_count
          )
          print(
              "Regiões:",
              region_count
          )
          print(
              "Commodities:",
              commodity_count
          )
          print(
              "======================================"
          )

      # ==============================================================
      # VERIFICAR RESULTADO
      # ==============================================================

      - name: Verificar arquivo
        run: |
          echo "Primeiras linhas do arquivo:"
          head -100 data/news-live.json

      # ==============================================================
      # SALVAR NO GITHUB
      # ==============================================================

      - name: Salvar alterações
        run: |

          git config user.name "Radar Agro Global"
          git config user.email "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualizar notícias agro automaticamente"

          # Atualiza a referência local antes do push.
          git fetch origin main

          git rebase origin/main

          git push origin main
