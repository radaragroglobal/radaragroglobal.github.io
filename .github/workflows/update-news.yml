              "trigo",
              "arroz",
              "café",
              "cacao",
              "azúcar",
              "caña de azúcar",
              "algodón",

              "ganado",
              "ganadería",

              "carne vacuna",
              "pollo",
              "cerdo",
              "porcino",

              "fertilizante",
              "fertilizantes",

              "grano",
              "granos",

              "exportación",
              "exportaciones",

              "importación",
              "importaciones",

              "precios agrícolas",
              "precios de alimentos",

              "mercado agrícola",

              "sequía",
              "inundación",
              "lluvias",
              "clima"
          ]


          ALL_AGRO_TERMS = (
              AGRO_TERMS +
              AGRO_PT +
              AGRO_ES
          )


          # ========================================================
          # COMMODITIES
          # ========================================================

          COMMODITIES = {

              "Soja": [
                  "soybean",
                  "soybeans",
                  "soy",
                  "soja"
              ],

              "Milho": [
                  "corn",
                  "maize",
                  "milho",
                  "maíz"
              ],

              "Trigo": [
                  "wheat",
                  "trigo"
              ],

              "Arroz": [
                  "rice",
                  "arroz"
              ],

              "Café": [
                  "coffee",
                  "café"
              ],

              "Cacau": [
                  "cocoa",
                  "cacao",
                  "cacau"
              ],

              "Açúcar": [
                  "sugar",
                  "sugarcane",
                  "açúcar",
                  "azúcar"
              ],

              "Algodão": [
                  "cotton",
                  "algodão",
                  "algodón"
              ],

              "Carne bovina": [
                  "beef",
                  "cattle",
                  "livestock",
                  "carne bovina",
                  "gado",
                  "carne vacuna",
                  "ganado"
              ],

              "Frango": [
                  "poultry",
                  "chicken",
                  "frango",
                  "pollo"
              ],

              "Carne suína": [
                  "pork",
                  "swine",
                  "suínos",
                  "cerdo",
                  "porcino"
              ],

              "Fertilizantes": [
                  "fertilizer",
                  "fertiliser",
                  "fertilizante",
                  "fertilizantes"
              ]
          }


          # ========================================================
          # FONTES PRIORITÁRIAS
          # ========================================================

          TRUSTED_DOMAINS = {

              "reuters.com",
              "apnews.com",
              "bbc.com",
              "bbc.co.uk",
              "ft.com",
              "bloomberg.com",
              "cnbc.com",

              "fao.org",
              "worldbank.org",
              "usda.gov",

              "gov.br",
              "embrapa.br",

              "globorural.globo.com",
              "canalrural.com.br",
              "noticiasagricolas.com.br"
          }


          # ========================================================
          # DOMÍNIOS BLOQUEADOS
          # ========================================================

          BLOCKED_DOMAINS = {

              "baijiahao.baidu.com",
              "163.com",
              "mankatofreepress.com",
              "wsls.com",
              "science20.com",

              "webdunia.com",
              "haberler.com",
              "lrytas.lt",
              "respუბლika.lt",
              "respublika.lt",
              "dw.com"
          }


          # ========================================================
          # NORMALIZAÇÃO
          # ========================================================

          def normalize(text):

              text = unescape(
                  str(text or "")
              )

              text = text.lower()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^\w\s]",
                  " ",
                  text,
                  flags=re.UNICODE
              )

              return text.strip()


          # ========================================================
          # ESCRITAS NÃO PERMITIDAS
          # ========================================================

          def contains_forbidden_script(text):

              if not text:

                  return True

              forbidden_ranges = [

                  r"[\u3040-\u30ff]",

                  r"[\u3400-\u4dbf]",
                  r"[\u4e00-\u9fff]",

                  r"[\uac00-\ud7af]",

                  r"[\u0600-\u06ff]",

                  r"[\u0590-\u05ff]",

                  r"[\u0400-\u04ff]",

                  r"[\u0370-\u03ff]",

                  r"[\u0900-\u097f]",

                  r"[\u0980-\u09ff]",

                  r"[\u0a80-\u0aff]",

                  r"[\u0e00-\u0e7f]"
              ]

              for pattern in forbidden_ranges:

                  if re.search(
                      pattern,
                      text
                  ):

                      return True

              return False


          # ========================================================
          # VERIFICAR SE É AGRO
          # ========================================================

          def agro_matches(title):

              normalized = normalize(title)

              matches = []

              for term in ALL_AGRO_TERMS:

                  normalized_term = normalize(term)

                  if not normalized_term:

                      continue

                  if normalized_term in normalized:

                      matches.append(
                          normalized_term
                      )

              return list(
                  dict.fromkeys(matches)
              )


          # ========================================================
          # DETECTAR COMMODITIES
          # ========================================================

          def detect_commodities(title):

              normalized = normalize(title)

              found = []

              for commodity, terms in COMMODITIES.items():

                  for term in terms:

                      if normalize(term) in normalized:

                          found.append(
                              commodity
                          )

                          break

              return found


          # ========================================================
          # DOMÍNIO
          # ========================================================

          def clean_domain(domain):

              domain = str(
                  domain or ""
              ).lower().strip()

              domain = domain.replace(
                  "www.",
                  ""
              )

              return domain


          def is_trusted_domain(domain):

              domain = clean_domain(domain)

              for trusted in TRUSTED_DOMAINS:

                  if (
                      domain == trusted
                      or domain.endswith(
                          "." + trusted
                      )
                  ):

                      return True

              return False


          def is_blocked_domain(domain):

              domain = clean_domain(domain)

              for blocked in BLOCKED_DOMAINS:

                  if (
                      domain == blocked
                      or domain.endswith(
                          "." + blocked
                      )
                  ):

                      return True

              return False


          # ========================================================
          # DEDUPLICAÇÃO
          # ========================================================

          def normalize_title(title):

              text = normalize(title)

              stopwords = {

                  "the", "a", "an", "of",
                  "and", "to", "in", "on",
                  "for", "with", "from",
                  "by", "as", "at",

                  "o", "a", "os", "as",
                  "de", "da", "do",
                  "e", "para", "em",
                  "com", "por",

                  "el", "la", "los",
                  "las", "del",
                  "y", "en", "con"
              }

              words = [

                  word

                  for word in text.split()

                  if word not in stopwords
              ]

              return " ".join(words)


          # ========================================================
          # GDELT
          # ========================================================

          def fetch_gdelt(query):

              encoded = urllib.parse.quote(
                  query
              )

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=50"
                  "&timespan=72h"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:

                  request = urllib.request.Request(

                      url,

                      headers={
                          "User-Agent":
                          "RadarAgroGlobal/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                  return json.loads(raw)

              except Exception as error:

                  print(
                      "ERRO GDELT:",
                      error
                  )

                  return {
                      "articles": []
                  }


          # ========================================================
          # COLETA
          # ========================================================

          collected = []


          for region, region_query in REGION_QUERIES.items():

              for language_name, language_code in LANGUAGES.items():

                  query = (
                      f"({region_query}) "
                      f"sourcelang:{language_code}"
                  )

                  print("")
                  print("=" * 70)
                  print("REGIÃO:", region)
                  print("IDIOMA:", language_name)
                  print("=" * 70)

                  data = fetch_gdelt(
                      query
                  )

                  articles = data.get(
                      "articles",
                      []
                  )

                  print(
                      "Resultados recebidos:",
                      len(articles)
                  )


                  for article in articles:

                      title = str(
                          article.get(
                              "title",
                              ""
                          )
                      ).strip()


                      url = str(
                          article.get(
                              "url",
                              ""
                          )
                      ).strip()


                      source = clean_domain(
                          article.get(
                              "domain",
                              ""
                          )
                      )


                      date = str(
                          article.get(
                              "seendate",
                              ""
                          )
                      ).strip()


                      if not title or not url:

                          continue


                      # =================================================
                      # IDIOMA
                      #
                      # O idioma é determinado pelo sourcelang
                      # usado na consulta.
                      # =================================================

                      article_language = language_name


                      # =================================================
                      # ALFABETO
                      # =================================================

                      if contains_forbidden_script(
                          title
                      ):

                          continue


                      # =================================================
                      # DOMÍNIO BLOQUEADO
                      # =================================================

                      if is_blocked_domain(
                          source
                      ):

                          continue


                      # =================================================
                      # AGRO
                      # =================================================

                      agro = agro_matches(
                          title
                      )

                      if not agro:

                          continue


                      # =================================================
                      # COMMODITIES
                      # =================================================

                      commodities = detect_commodities(
                          title
                      )


                      # =================================================
                      # FILTRO DE CONTEÚDO GENÉRICO
                      # =================================================

                      normalized_title = normalize(
                          title
                      )


                      generic_terms = [

                          "entertainment",
                          "celebrity",
                          "movie",
                          "music",
                          "football",
                          "soccer",
                          "tourism",
                          "restaurant",
                          "recipe",
                          "fashion",
                          "lifestyle",
                          "horoscope",
                          "concert",
                          "actor",
                          "actress",
                          "sports"
                      ]


                      if any(
                          term in normalized_title
                          for term in generic_terms
                      ):

                          continue


                      # =================================================
                      # SCORE
                      # =================================================

                      score = 0


                      score += min(
                          len(agro),
                          5
                      ) * 2


                      score += min(
                          len(commodities),
                          3
                      ) * 4


                      if is_trusted_domain(
                          source
                      ):

                          score += 10


                      if len(title) >= 60:

                          score += 1


                      if len(title) >= 100:

                          score += 1


                      # =================================================
                      # CHAVE
                      # =================================================

                      title_key = normalize_title(
                          title
                      )


                      if not title_key:

                          continue


                      collected.append({

                          "region": region,

                          "title": title,

                          "url": url,

                          "source": source,

                          "date": date,

                          "language": article_language,

                          "commodities": commodities,

                          "_score": score,

                          "_key": title_key
                      })


          # ============================================================
          # DEDUPLICAÇÃO
          # ============================================================

          unique = {}


          for item in collected:

              key = item["_key"]

              if key not in unique:

                  unique[key] = item

              else:

                  current = unique[key]

                  if (
                      item["_score"]
                      >
                      current["_score"]
                  ):

                      unique[key] = item


          news = list(
              unique.values()
          )


          # ============================================================
          # ORDENAR
          # ============================================================

          news.sort(

              key=lambda item: (
                  item.get(
                      "_score",
                      0
                  ),
                  item.get(
                      "date",
                      ""
                  )
              ),

              reverse=True
          )


          # ============================================================
          # DISTRIBUIÇÃO POR REGIÃO
          # ============================================================

          balanced = []

          region_count_temp = {}


          for item in news:

              region = item["region"]

              count = region_count_temp.get(
                  region,
                  0
              )


              if count >= 12:

                  continue


              balanced.append(
                  item
              )


              region_count_temp[region] = (
                  count + 1
              )


          news = balanced[:120]


          # ============================================================
          # REMOVER CAMPOS INTERNOS
          # ============================================================

          for item in news:

              item.pop(
                  "_score",
                  None
              )

              item.pop(
                  "_key",
                  None
              )


          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_count = {}

          region_count = {}

          commodity_count = {}


          for item in news:

              language = item.get(
                  "language",
                  "Unknown"
              )


              region = item.get(
                  "region",
                  "Unknown"
              )


              language_count[language] = (
                  language_count.get(
                      language,
                      0
                  ) + 1
              )


              region_count[region] = (
                  region_count.get(
                      region,
                      0
                  ) + 1
              )


              for commodity in item.get(
                  "commodities",
                  []
              ):

                  commodity_count[commodity] = (
                      commodity_count.get(
                          commodity,
                          0
                      ) + 1
                  )


          # ============================================================
          # RESULTADO
          # ============================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "GDELT",

              "count":
                  len(news),

              "languages":
                  language_count,

              "regions":
                  region_count,

              "commodities":
                  commodity_count,

              "news":
                  news
          }


          # ============================================================
          # SALVAR
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # LOG
          # ============================================================

          print("")
          print("=" * 70)
          print("RADAR AGRO ATUALIZADO")
          print("=" * 70)
          print("Total:", len(news))
          print("Idiomas:", language_count)
          print("Regiões:", region_count)
          print("Commodities:", commodity_count)
          print("=" * 70)


          # ============================================================
          # MOSTRAR NOTÍCIAS
          # ============================================================

          for i, item in enumerate(
              news[:20],
              1
          ):

              print(
                  f"{i}. "
                  f"[{item['region']}] "
                  f"[{item['language']}] "
                  f"{item['title']}"
              )

              print(
                  f"   Fonte: {item['source']}"
              )

              print(
                  f"   URL: {item['url']}"
              )

              print("")


      # ==============================================================
      # VALIDAR RESULTADO
      # ==============================================================

      - name: Validar arquivo
        shell: python
        run: |

          import json
          import sys


          path = "data/news-live.json"


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          allowed = {
              "English",
              "Portuguese",
              "Spanish"
          }


          news = data.get(
              "news",
              []
          )


          errors = []


          for item in news:

              language = item.get(
                  "language"
              )


              if language not in allowed:

                  errors.append(
                      f"Idioma inválido: {language}"
                  )


              if not item.get(
                  "title"
              ):

                  errors.append(
                      "Notícia sem título"
                  )


              if not item.get(
                  "url"
              ):

                  errors.append(
                      "Notícia sem URL"
                  )


              if not item.get(
                  "region"
              ):

                  errors.append(
                      "Notícia sem região"
                  )


          if errors:

              print(
                  "ERROS ENCONTRADOS:"
              )

              for error in errors:

                  print(error)

              sys.exit(1)


          print(
              f"Arquivo validado: "
              f"{len(news)} notícias."
          )


          print(
              "Idiomas:",
              data.get(
                  "languages",
                  {}
              )
          )


          print(
              "Regiões:",
              data.get(
                  "regions",
                  {}
              )
          )


      # ==============================================================
      # SALVAR NO GITHUB
      # ==============================================================

      - name: Salvar alterações
        run: |

          git config user.name \
            "Radar Agro Global"

          git config user.email \
            "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json


          if git diff --cached --quiet; then

            echo "Nenhuma alteração para salvar."

            exit 0

          fi


          git commit \
            -m "Atualizar notícias agro automaticamente"


          git fetch origin main


          git rebase origin/main


          git push origin main
