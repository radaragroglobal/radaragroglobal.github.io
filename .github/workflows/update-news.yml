              "climate",

              "heatwave",
              "frost",

              "tariff",
              "tariffs",

              "trade",
              "shipment",
              "shipments",

              "supply",
              "demand",

              "stocks",
              "forecast"
          ]


          AGRO_PT = [

              "agricultura",
              "agrícola",
              "agricultor",
              "agricultores",
              "agropecuária",
              "agropecuário",

              "lavoura",
              "lavouras",

              "safra",
              "safras",

              "plantio",
              "colheita",

              "produção",
