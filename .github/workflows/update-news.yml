          ]


          ALL_AGRO_TERMS = AGRO_TERMS + AGRO_PT + AGRO_ES


          # ========================================================
          # COMMODITIES
          # ========================================================

          COMMODITIES = {

              "Soja": [
                  "soybean",
                  "soybeans",
                  "soy",
                  "soja"
              ],

              "Milho": [
                  "corn",
                  "maize",
                  "milho",
                  "maíz"
              ],

              "Trigo": [
                  "wheat",
                  "trigo"
              ],

              "Arroz": [
                  "rice",
                  "arroz"
              ],

              "Café": [
                  "coffee",
                  "café"
              ],

              "Cacau": [
                  "cocoa",
                  "cacao",
                  "cacau"
              ],

              "Açúcar": [
                  "sugar",
                  "sugarcane",
                  "açúcar",
                  "azúcar",
                  "cana de açúcar",
                  "caña de azúcar"
              ],

              "Algodão": [
                  "cotton",
                  "algodão",
                  "algodón"
              ],

              "Carne bovina": [
                  "beef",
                  "cattle",
                  "livestock",
                  "carne bovina",
                  "gado",
                  "carne vacuna",
                  "ganado"
              ],

              "Frango": [
                  "poultry",
                  "chicken",
                  "frango",
                  "pollo"
              ],

              "Carne suína": [
                  "pork",
                  "swine",
                  "suínos",
                  "suinocultura",
                  "cerdo",
                  "porcino"
              ],

              "Fertilizantes": [
                  "fertilizer",
                  "fertilisers",
                  "fertiliser",
                  "fertilizante",
                  "fertilizantes"
              ]
          }


          # ========================================================
          # FONTES PRIORITÁRIAS
          # ========================================================

          TRUSTED_DOMAINS = {

              "reuters.com",
              "apnews.com",
              "bbc.com",
              "bbc.co.uk",
              "ft.com",
              "bloomberg.com",
              "cnbc.com",

              "fao.org",
              "worldbank.org",
              "usda.gov",

              "gov.br",
              "embrapa.br",

              "globorural.globo.com",
              "canalrural.com.br",
              "noticiasagricolas.com.br"
          }


          # ========================================================
          # FONTES QUE NORMALMENTE GERAM RUÍDO
          # ========================================================

          BLOCKED_DOMAINS = {

              "baijiahao.baidu.com",
              "163.com",
              "mankatofreepress.com",
              "wsls.com",
              "science20.com"
          }


          # ========================================================
          # NORMALIZAÇÃO
          # ========================================================

          def normalize(text):

              text = unescape(str(text or ""))
              text = text.lower()

              text = text.replace("&amp;", " and ")

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^\w\s]",
                  " ",
                  text,
                  flags=re.UNICODE
              )

              return text.strip()


          # ========================================================
          # SCRIPTS NÃO PERMITIDOS
          # ========================================================

          def contains_forbidden_script(text):

              if not text:
                  return True

              forbidden_ranges = [

                  # japonês / chinês
                  r"[\u3040-\u30ff]",
                  r"[\u3400-\u4dbf]",
                  r"[\u4e00-\u9fff]",

                  # coreano
                  r"[\uac00-\ud7af]",

                  # árabe
                  r"[\u0600-\u06ff]",

                  # hebraico
                  r"[\u0590-\u05ff]",

                  # cirílico
                  r"[\u0400-\u04ff]",

                  # grego
                  r"[\u0370-\u03ff]",

                  # devanagari
                  r"[\u0900-\u097f]",

                  # bengali
                  r"[\u0980-\u09ff]",

                  # gujarati
                  r"[\u0a80-\u0aff]",

                  # thai
                  r"[\u0e00-\u0e7f]"
              ]

              for pattern in forbidden_ranges:

                  if re.search(pattern, text):

                      return True

              return False


          # ========================================================
          # VERIFICAR AGRO
          # ========================================================

          def agro_matches(title):

              normalized = normalize(title)

              matches = []

              for term in ALL_AGRO_TERMS:

                  normalized_term = normalize(term)

                  if not normalized_term:
                      continue

                  if normalized_term in normalized:

                      matches.append(normalized_term)

              return list(dict.fromkeys(matches))


          # ========================================================
          # COMMODITIES
          # ========================================================

          def detect_commodities(title):

              normalized = normalize(title)

              found = []

              for commodity, terms in COMMODITIES.items():

                  for term in terms:

                      if normalize(term) in normalized:

                          found.append(commodity)
                          break

              return found


          # ========================================================
          # DOMÍNIO
          # ========================================================

          def clean_domain(domain):

              domain = str(domain or "").lower().strip()

              domain = domain.replace(
                  "www.",
                  ""
              )

              return domain


          def is_trusted_domain(domain):

              domain = clean_domain(domain)

              for trusted in TRUSTED_DOMAINS:

                  trusted = clean_domain(trusted)

                  if (
                      domain == trusted
                      or domain.endswith("." + trusted)
                  ):

                      return True

              return False


          def is_blocked_domain(domain):

              domain = clean_domain(domain)

              for blocked in BLOCKED_DOMAINS:

                  blocked = clean_domain(blocked)

                  if (
                      domain == blocked
                      or domain.endswith("." + blocked)
                  ):

                      return True

              return False


          # ========================================================
          # DEDUPLICAÇÃO
          # ========================================================

          def normalize_title(title):

              text = normalize(title)

              stopwords = {

                  "the", "a", "an", "of", "and",
                  "to", "in", "on", "for", "with",
                  "from", "by", "as", "at",

                  "o", "a", "os", "as", "de",
                  "da", "do", "e", "para",
                  "em", "com", "por",

                  "el", "la", "los", "las",
                  "de", "del", "y", "en",
                  "con", "por"
              }

              words = [

                  word

                  for word in text.split()

                  if word not in stopwords
              ]

              return " ".join(words)


          # ========================================================
          # GDELT
          # ========================================================

          def fetch_gdelt(query):

              encoded = urllib.parse.quote(
                  query
              )

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=30"
                  "&timespan=72h"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:

                  request = urllib.request.Request(

                      url,

                      headers={
                          "User-Agent":
                          "RadarAgroGlobal/4.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                  return json.loads(raw)

              except Exception as error:

                  print(
                      "ERRO GDELT:",
                      error
                  )

                  return {
                      "articles": []
                  }


          # ========================================================
          # CONSULTAS
          #
          # A região é definida aqui.
          # O título não pode "mover" a notícia para outra região.
          # ========================================================

          REGION_QUERIES = {

              "Brasil": (
                  '("Brazil agriculture" OR '
                  '"Brazilian agriculture" OR '
                  '"Brazil soybean" OR '
                  '"Brazil corn" OR '
                  '"Brazil coffee" OR '
                  '"Brazil cattle" OR '
                  '"Brazil grain" OR '
                  '"Brazil fertilizer")'
              ),

              "África": (
                  '("Africa agriculture" OR '
                  '"African agriculture" OR '
                  '"African farmers" OR '
                  '"Nigeria agriculture" OR '
                  '"Kenya agriculture" OR '
                  '"Ethiopia agriculture" OR '
                  '"Ghana agriculture" OR '
                  '"South Africa agriculture" OR '
                  '"Zambia agriculture" OR '
                  '"Zimbabwe agriculture" OR '
                  '"Tanzania agriculture" OR '
                  '"Uganda agriculture" OR '
                  '"Mozambique agriculture" OR '
                  '"Angola agriculture" OR '
                  '"Senegal agriculture" OR '
                  '"Mali agriculture" OR '
                  '"Burkina Faso agriculture" OR '
                  '"Cameroon agriculture" OR '
                  '"Benin agriculture" OR '
                  '"Ivory Coast agriculture")'
              ),

              "Estados Unidos": (
                  '("United States agriculture" OR '
                  '"U.S. agriculture" OR '
                  '"American agriculture" OR '
                  '"American farmers" OR '
                  '"U.S. soybean" OR '
                  '"U.S. corn" OR '
                  '"U.S. wheat" OR '
                  '"U.S. cattle")'
              ),

              "China": (
                  '("China agriculture" OR '
                  '"Chinese agriculture" OR '
                  '"Chinese farmers" OR '
                  '"China soybean" OR '
                  '"China corn" OR '
                  '"China wheat" OR '
                  '"China rice" OR '
                  '"China grain" OR '
                  '"China agricultural imports")'
              ),

              "Argentina": (
                  '("Argentina agriculture" OR '
                  '"Argentine agriculture" OR '
                  '"Argentine farmers" OR '
                  '"Argentina soybean" OR '
                  '"Argentina corn" OR '
                  '"Argentina wheat" OR '
                  '"Argentina grain")'
              ),

              "Índia": (
                  '("India agriculture" OR '
                  '"Indian agriculture" OR '
                  '"Indian farmers" OR '
                  '"India soybean" OR '
                  '"India wheat" OR '
                  '"India rice" OR '
                  '"India sugar" OR '
                  '"India grain")'
              ),

              "Europa": (
                  '("European agriculture" OR '
                  '"European farmers" OR '
                  '"European Union agriculture" OR '
                  '"EU agriculture" OR '
                  '"Europe grain" OR '
                  '"Europe wheat" OR '
                  '"European fertilizer")'
              ),

              "Rússia e Ucrânia": (
                  '("Russia agriculture" OR '
                  '"Russian agriculture" OR '
                  '"Ukraine agriculture" OR '
                  '"Ukrainian agriculture" OR '
                  '"Russian wheat" OR '
                  '"Ukrainian wheat" OR '
                  '"Ukraine grain" OR '
                  '"Black Sea grain" OR '
                  '"Russia grain exports" OR '
                  '"Ukraine grain exports")'
              ),

              "Austrália": (
                  '("Australia agriculture" OR '
                  '"Australian agriculture" OR '
                  '"Australian farmers" OR '
                  '"Australian wheat" OR '
                  '"Australian grain" OR '
                  '"Australia livestock")'
              ),

              "Oriente Médio": (
                  '("Middle East agriculture" OR '
                  '"Middle East food security" OR '
                  '"Saudi Arabia agriculture" OR '
                  '"Iran agriculture" OR '
                  '"Iraq agriculture" OR '
                  '"Israel agriculture" OR '
                  '"UAE agriculture" OR '
                  '"Qatar agriculture" OR '
                  '"Yemen agriculture" OR '
                  '"Oman agriculture")'
              ),

              "América Latina": (
                  '("Latin America agriculture" OR '
                  '"Latin American agriculture" OR '
                  '"Mexico agriculture" OR '
                  '"Colombia agriculture" OR '
                  '"Chile agriculture" OR '
                  '"Peru agriculture" OR '
                  '"Paraguay agriculture" OR '
                  '"Uruguay agriculture" OR '
                  '"Bolivia agriculture" OR '
                  '"Ecuador agriculture")'
              )
          }


          # ========================================================
          # COLETA
          # ========================================================

          collected = []


          for region, region_query in REGION_QUERIES.items():

              for language_name, language_code in LANGUAGES.items():

                  query = (
                      f"({region_query}) "
                      f"sourcelang:{language_code}"
                  )

                  print("")
                  print("=" * 70)
                  print("REGIÃO:", region)
                  print("IDIOMA:", language_name)
                  print("QUERY:", query)
                  print("=" * 70)

                  data = fetch_gdelt(query)

                  articles = data.get(
                      "articles",
                      []
                  )

                  for article in articles:

                      title = str(
                          article.get(
                              "title",
                              ""
                          )
                      ).strip()

                      url = str(
                          article.get(
                              "url",
                              ""
                          )
                      ).strip()

                      source = clean_domain(
                          article.get(
                              "domain",
                              ""
                          )
                      )

                      date = str(
                          article.get(
                              "seendate",
                              ""
                          )
                      ).strip()

                      article_language = str(
                          article.get(
                              "language",
                              ""
                          )
                      ).strip()


                      # ------------------------------------------------
                      # CAMPOS OBRIGATÓRIOS
                      # ------------------------------------------------

                      if not title or not url:

                          continue


                      # ------------------------------------------------
                      # IDIOMA
                      #
                      # O idioma precisa ser confirmado.
                      # Campo vazio também é rejeitado.
                      # ------------------------------------------------

                      if article_language not in ALLOWED_LANGUAGES:

                          print(
                              "REJEITADO - idioma:",
                              article_language,
                              "|",
                              title
                          )

                          continue


                      # ------------------------------------------------
                      # GARANTIA EXTRA CONTRA OUTROS ALFABETOS
                      # ------------------------------------------------

                      if contains_forbidden_script(title):

                          print(
                              "REJEITADO - escrita:",
                              title
                          )

                          continue


                      # ------------------------------------------------
                      # DOMÍNIOS BLOQUEADOS
                      # ------------------------------------------------

                      if is_blocked_domain(source):

                          print(
                              "REJEITADO - domínio:",
                              source
                          )

                          continue


                      # ------------------------------------------------
                      # AGRO
                      # ------------------------------------------------

                      agro = agro_matches(title)

                      if not agro:

                          continue


                      # ------------------------------------------------
                      # COMMODITIES
                      # ------------------------------------------------

                      commodities = detect_commodities(
                          title
                      )


                      # ------------------------------------------------
                      # RELEVÂNCIA
                      # ------------------------------------------------

                      score = 0

                      score += min(
                          len(agro),
                          5
                      ) * 2

                      score += min(
                          len(commodities),
                          3
                      ) * 4


                      if is_trusted_domain(source):

                          score += 8


                      if len(title) >= 60:

                          score += 1


                      if len(title) >= 100:

                          score += 1


                      # ------------------------------------------------
                      # REJEITAR TÍTULOS GENÉRICOS
                      # ------------------------------------------------

                      generic_terms = [

                          "entertainment",
                          "celebrity",
                          "movie",
                          "music",
                          "football",
                          "soccer",
                          "tourism",
                          "restaurant",
                          "recipe",
                          "fashion",
                          "lifestyle",
                          "horoscope",
                          "concert",
                          "actor",
                          "actress"
                      ]


                      normalized_title = normalize(
                          title
                      )


                      if any(
                          term in normalized_title
                          for term in generic_terms
                      ):

                          continue


                      # ------------------------------------------------
                      # CHAVE DE DEDUPLICAÇÃO
                      # ------------------------------------------------

                      title_key = normalize_title(
                          title
                      )

                      if not title_key:

                          continue


                      collected.append({

                          "region": region,

                          "title": title,

                          "url": url,

                          "source": source,

                          "date": date,

                          "language": article_language,

                          "commodities": commodities,

                          "_score": score,

                          "_key": title_key
                      })


          # ============================================================
          # DEDUPLICAÇÃO
          # ============================================================

          unique = {}


          for item in collected:

              key = item["_key"]

              if key not in unique:

                  unique[key] = item

              else:

                  current = unique[key]

                  if item["_score"] > current["_score"]:

                      unique[key] = item


          news = list(
              unique.values()
          )


          # ============================================================
          # ORDENAR
          # ============================================================

          news.sort(

              key=lambda item: (
                  item.get("_score", 0),
                  item.get("date", "")
              ),

              reverse=True
          )


          # ============================================================
          # DISTRIBUIÇÃO EQUILIBRADA
          #
          # Máximo 12 por região.
          # Não cria notícias falsas para completar.
          # ============================================================

          balanced = []

          region_count_temp = {}


          for item in news:

              region = item["region"]

              count = region_count_temp.get(
                  region,
                  0
              )

              if count >= 12:

                  continue


              balanced.append(
                  item
              )

              region_count_temp[region] = (
                  count + 1
              )


          news = balanced[:120]


          # ============================================================
          # REMOVER CAMPOS INTERNOS
          # ============================================================

          for item in news:

              item.pop(
                  "_score",
                  None
              )

              item.pop(
                  "_key",
                  None
              )


          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_count = {}

          region_count = {}

          commodity_count = {}


          for item in news:

              language = item.get(
                  "language",
                  "Unknown"
              )

              region = item.get(
                  "region",
                  "Unknown"
              )


              language_count[language] = (
                  language_count.get(
                      language,
                      0
                  ) + 1
              )


              region_count[region] = (
                  region_count.get(
                      region,
                      0
                  ) + 1
              )


              for commodity in item.get(
                  "commodities",
                  []
              ):

                  commodity_count[commodity] = (
                      commodity_count.get(
                          commodity,
                          0
                      ) + 1
                  )


          # ============================================================
          # RESULTADO
          # ============================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "GDELT",

              "count":
                  len(news),

              "languages":
                  language_count,

              "regions":
                  region_count,

              "commodities":
                  commodity_count,

              "news":
                  news
          }


          # ============================================================
          # SALVAR
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # LOG
          # ============================================================

          print("")
          print("=" * 70)
          print("RADAR AGRO ATUALIZADO")
          print("=" * 70)
          print("Total:", len(news))
          print("Idiomas:", language_count)
          print("Regiões:", region_count)
          print("Commodities:", commodity_count)
          print("=" * 70)


      # ==============================================================
      # VALIDAR RESULTADO
      # ==============================================================

      - name: Validar arquivo
        shell: python
        run: |

          import json
          import sys

          path = "data/news-live.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          allowed = {
              "English",
              "Portuguese",
              "Spanish"
          }


          news = data.get(
              "news",
              []
          )


          errors = []


          for item in news:

              language = item.get(
                  "language"
              )

              if language not in allowed:

                  errors.append(
                      f"Idioma inválido: {language}"
                  )


              if not item.get(
                  "title"
              ):

                  errors.append(
                      "Notícia sem título"
                  )


              if not item.get(
                  "url"
              ):

                  errors.append(
                      "Notícia sem URL"
                  )


              if not item.get(
                  "region"
              ):

                  errors.append(
                      "Notícia sem região"
                  )


          if errors:

              print(
                  "ERROS ENCONTRADOS:"
              )

              for error in errors:

                  print(
                      error
                  )

              sys.exit(1)


          print(
              f"Arquivo validado: {len(news)} notícias."
          )

          print(
              "Idiomas:",
              data.get(
                  "languages",
                  {}
              )
          )

          print(
              "Regiões:",
              data.get(
                  "regions",
                  {}
              )
          )


