name: Atualizar notícias do Radar Agro

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        shell: bash
        run: |
          cat > update_news.py <<'PY'
          import json
          import re
          import time
          import unicodedata
          from datetime import datetime, timezone
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          # ============================================================
          # CONFIGURAÇÃO
          # ============================================================

          OUTPUT = "data/news-live.json"

          LANGUAGES = {
              "English": "english",
              "Portuguese": "portuguese",
              "Spanish": "spanish",
          }

          # Termos agrícolas que precisam aparecer no título.
          AGRO_TERMS = [
              "agriculture",
              "agricultural",
              "farmer",
              "farmers",
              "farming",
              "crop",
              "crops",
              "harvest",
              "planting",
              "soybean",
              "soybeans",
              "soy",
              "corn",
              "maize",
              "wheat",
              "coffee",
              "cocoa",
              "cacao",
              "sugar",
              "cotton",
              "rice",
              "beef",
              "cattle",
              "livestock",
              "poultry",
              "pork",
              "fertilizer",
              "fertiliser",
              "grain",
              "grains",
              "commodity",
              "commodities",
              "export",
              "exports",
              "import",
              "imports",
              "food",
              "food security",
              "drought",
              "flood",
              "rainfall",
              "weather",
              "el niño",
              "la niña",

              "agricultura",
              "agrícola",
              "agricultor",
              "agricultores",
              "lavoura",
              "lavouras",
              "safra",
              "safras",
              "plantio",
              "colheita",
              "soja",
              "milho",
              "trigo",
              "café",
              "cacau",
              "açúcar",
              "algodão",
              "arroz",
              "carne bovina",
              "gado",
              "pecuária",
              "frango",
              "suína",
              "suínos",
              "fertilizante",
              "fertilizantes",
              "grãos",
              "commodity",
              "commodities",
              "exportação",
              "exportações",
              "importação",
              "importações",
              "alimentos",
              "segurança alimentar",
              "seca",
              "enchente",
              "chuva",
              "clima",

              "agricultura",
              "agrícola",
              "agricultor",
              "agricultores",
              "cultivo",
              "cultivos",
              "cosecha",
              "siembra",
              "plantación",
              "soja",
              "maíz",
              "trigo",
              "café",
              "cacao",
              "azúcar",
              "algodón",
              "arroz",
              "carne",
              "ganado",
              "ganadería",
              "pollo",
              "cerdo",
              "fertilizante",
              "fertilizantes",
              "grano",
              "granos",
              "producto agrícola",
              "productos básicos",
              "exportación",
              "exportaciones",
              "importación",
              "importaciones",
              "alimentos",
              "seguridad alimentaria",
              "sequía",
              "inundación",
              "lluvia",
              "clima",
          ]

          COMMODITIES = {
              "Soja": [
                  "soybean", "soybeans", "soy", "soja"
              ],
              "Milho": [
                  "corn", "maize", "milho", "maíz"
              ],
              "Trigo": [
                  "wheat", "trigo"
              ],
              "Café": [
                  "coffee", "café"
              ],
              "Cacau": [
                  "cocoa", "cacao", "cacau"
              ],
              "Açúcar": [
                  "sugar", "açúcar", "azúcar"
              ],
              "Algodão": [
                  "cotton", "algodão", "algodón"
              ],
              "Arroz": [
                  "rice", "arroz"
              ],
              "Carne bovina": [
                  "beef", "cattle", "beef cattle",
                  "carne bovina", "carne de res", "ganado"
              ],
              "Carne de frango": [
                  "poultry", "chicken", "frango", "pollo"
              ],
              "Carne suína": [
                  "pork", "pig", "swine", "suíno", "suína", "cerdo"
              ],
              "Fertilizantes": [
                  "fertilizer", "fertiliser",
                  "fertilizante", "fertilizantes"
              ]
          }

          REGIONS = {
              "Brasil": [
                  "Brazil",
                  "Brasil",
                  "Brazilian",
                  "brasileiro",
                  "brasileira"
              ],

              "África": [
                  "Africa",
                  "African",
                  "África",
                  "africano",
                  "africana"
              ],

              "Estados Unidos": [
                  "United States",
                  "U.S.",
                  "US",
                  "USA",
                  "American",
                  "Estados Unidos",
                  "estadounidense"
              ],

              "China": [
                  "China",
                  "Chinese",
                  "China",
                  "chino",
                  "china"
              ],

              "Argentina": [
                  "Argentina",
                  "Argentine",
                  "Argentinean",
                  "argentino",
                  "argentina"
              ],

              "Índia": [
                  "India",
                  "Indian",
                  "Índia",
                  "indiano",
                  "indiana"
              ],

              "Europa": [
                  "Europe",
                  "European",
                  "Europa",
                  "europeu",
                  "europeia"
              ],

              "Rússia e Ucrânia": [
                  "Russia",
                  "Russian",
                  "Ukraine",
                  "Ukrainian",
                  "Rússia",
                  "Rússia",
                  "Ucrânia",
                  "ucraniano",
                  "ucraniana"
              ],

              "Oriente Médio": [
                  "Middle East",
                  "Israel",
                  "Iran",
                  "Iraq",
                  "Saudi Arabia",
                  "Saudi",
                  "Qatar",
                  "United Arab Emirates",
                  "UAE",
                  "Yemen",
                  "Syria",
                  "Jordan",
                  "Egypt",
                  "Oriente Médio",
                  "Irã",
                  "Iraque",
                  "Arábia Saudita"
              ],

              "Austrália": [
                  "Australia",
                  "Australian",
                  "Austrália",
                  "australiano",
                  "australiana"
              ],

              "América Latina": [
                  "Latin America",
                  "Latin American",
                  "América Latina",
                  "latino-americano",
                  "latinoamericana"
              ],

              "Ásia": [
                  "Asia",
                  "Asian",
                  "Ásia",
                  "asiático",
                  "asiática"
              ],
          }

          # Domínios que queremos evitar.
          BLOCKED_DOMAINS = {
              "baijiahao.baidu.com",
              "163.com",
              "mankatofreepress.com",
              "wsls.com",
              "science20.com",
              "webdunia.com",
              "haberler.com",
              "lrytas.lt",
              "respublika.lt",
          }

          # Termos que normalmente indicam conteúdo não útil para o radar.
          BAD_TERMS = [
              "celebrity",
              "entertainment",
              "movie",
              "movies",
              "music",
              "actor",
              "actress",
              "football",
              "soccer",
              "basketball",
              "cricket",
              "tennis",
              "horoscope",
              "fashion",
              "wedding",
              "lifestyle",
              "recipe",
              "recipes",
              "gaming",
              "game",
              "games",
              "casino",
              "lottery",
              "meme",
              "viral",
              "influencer",
              "celebrity",
              "celebridades",
              "entretenimento",
              "futebol",
              "basquete",
              "filme",
              "filmes",
              "música",
              "receita",
              "receitas",
              "jogo",
              "jogos",
              "famosos",
              "famosas",
          ]

          # ============================================================
          # FUNÇÕES
          # ============================================================

          def normalize(text):
              text = str(text or "").lower()
              text = unicodedata.normalize("NFKD", text)
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )
              return re.sub(r"\s+", " ", text).strip()


          def contains_bad_script(text):
              """
              Aceita basicamente alfabetos usados por inglês,
              português e espanhol.
              Bloqueia caracteres de chinês, japonês, coreano,
              árabe, hebraico, cirílico, devanágari etc.
              """
              blocked_ranges = [
                  (0x0400, 0x04FF),  # Cirílico
                  (0x0600, 0x06FF),  # Árabe
                  (0x0700, 0x074F),
                  (0x0750, 0x077F),
                  (0x0780, 0x07BF),
                  (0x0900, 0x097F),  # Devanágari
                  (0x0980, 0x09FF),
                  (0x0A00, 0x0A7F),
                  (0x0A80, 0x0AFF),
                  (0x0B00, 0x0B7F),
                  (0x0B80, 0x0BFF),
                  (0x0C00, 0x0C7F),
                  (0x0C80, 0x0CFF),
                  (0x0D00, 0x0D7F),
                  (0x0D80, 0x0DFF),
                  (0x0E00, 0x0E7F),
                  (0x0E80, 0x0EFF),
                  (0x1100, 0x11FF),  # Hangul
                  (0x3040, 0x30FF),  # Japonês
                  (0x3400, 0x4DBF),  # CJK
                  (0x4E00, 0x9FFF),  # Chinês
                  (0xAC00, 0xD7AF),  # Coreano
                  (0xFB50, 0xFDFF),
                  (0xFE70, 0xFEFF),
              ]

              for char in text:
                  code = ord(char)
                  for start, end in blocked_ranges:
                      if start <= code <= end:
                          return True

              return False


          def get_domain(url):
              match = re.search(r"https?://([^/]+)", url or "")
              if not match:
                  return ""

              domain = match.group(1).lower()
              domain = domain.split("@")[-1]
              domain = domain.split(":")[0]

              if domain.startswith("www."):
                  domain = domain[4:]

              return domain


          def contains_any(text, terms):
              normalized = normalize(text)

              for term in terms:
                  if normalize(term) in normalized:
                      return True

              return False


          def detect_commodity(text):
              normalized = normalize(text)

              found = []

              for commodity, terms in COMMODITIES.items():
                  for term in terms:
                      if normalize(term) in normalized:
                          found.append(commodity)
                          break

              return found


          def valid_agro_title(title):
              normalized = normalize(title)

              if len(normalized) < 30:
                  return False

              if contains_bad_script(title):
                  return False

              if not contains_any(title, AGRO_TERMS):
                  return False

              bad_hits = 0

              for term in BAD_TERMS:
                  if normalize(term) in normalized:
                      bad_hits += 1

              if bad_hits >= 2:
                  return False

              return True


          def detect_region_from_query(region, title):
              """
              A região é definida pela consulta que originou a notícia.
              Aqui fazemos apenas uma checagem adicional para evitar
              resultados totalmente desconectados.
              """
              if region == "Mundo":
                  return True

              normalized = normalize(title)

              terms = REGIONS.get(region, [])

              for term in terms:
                  if normalize(term) in normalized:
                      return True

              # Notícias agrícolas globais podem não citar o país
              # no título. Permitimos quando a consulta já foi específica.
              return True


          def fetch_gdelt(query):
              encoded = quote(query, safe="")

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=40"
                  "&timespan=3d"
                  "&sort=datedesc"
                  "&format=json"
              )

              request = Request(
                  url,
                  headers={
                      "User-Agent": "RadarAgroGlobal/1.0"
                  }
              )

              try:
                  with urlopen(request, timeout=30) as response:
                      data = response.read().decode("utf-8")

                  parsed = json.loads(data)

                  return parsed.get("articles", [])

              except Exception as error:
                  print(f"Erro GDELT: {error}")
                  return []


          def make_query(region, language_code):
              agro_query = (
                  '(agriculture OR agricultural OR farming OR crop OR crops '
                  'OR harvest OR planting OR soybean OR soybeans OR soy '
                  'OR corn OR maize OR wheat OR coffee OR cocoa OR cacao '
                  'OR sugar OR cotton OR rice OR beef OR cattle OR livestock '
                  'OR poultry OR pork OR fertilizer OR fertiliser OR grain '
                  'OR grains OR commodity OR commodities OR exports '
                  'OR imports OR food security OR drought OR rainfall '
                  'OR agriculture OR agricultura OR agricola OR agronomía '
                  'OR agropecuaria OR soja OR milho OR maiz OR trigo '
                  'OR cafe OR café OR cacau OR cacao OR acucar OR azúcar '
                  'OR algodao OR algodón OR arroz OR carne OR ganado '
                  'OR fertilizante OR fertilizantes OR grano OR granos)'
              )

              region_query = ""

              if region != "Mundo":
                  if region == "Brasil":
                      region_query = (
                          '("Brazil" OR "Brazilian" OR "Brasil" '
                          'OR "brasileiro" OR "brasileira")'
                      )

                  elif region == "África":
                      region_query = (
                          '("Africa" OR "African" OR "África" '
                          'OR "africano" OR "africana")'
                      )

                  elif region == "Estados Unidos":
                      region_query = (
                          '("United States" OR "U.S." OR "USA" '
                          'OR "American" OR "Estados Unidos")'
                      )

                  elif region == "China":
                      region_query = (
                          '("China" OR "Chinese")'
                      )

                  elif region == "Argentina":
                      region_query = (
                          '("Argentina" OR "Argentine" OR "Argentinean")'
                      )

                  elif region == "Índia":
                      region_query = (
                          '("India" OR "Indian" OR "Índia")'
                      )

                  elif region == "Europa":
                      region_query = (
                          '("Europe" OR "European" OR "Europa")'
                      )

                  elif region == "Rússia e Ucrânia":
                      region_query = (
                          '("Russia" OR "Russian" OR "Ukraine" '
                          'OR "Ukrainian" OR "Rússia" OR "Ucrânia")'
                      )

                  elif region == "Oriente Médio":
                      region_query = (
                          '("Middle East" OR "Israel" OR "Iran" '
                          'OR "Iraq" OR "Saudi Arabia" OR "Qatar" '
                          'OR "United Arab Emirates" OR "UAE" OR "Yemen" '
                          'OR "Syria" OR "Jordan" OR "Egypt" '
                          'OR "Oriente Médio" OR "Irã" OR "Iraque")'
                      )

                  elif region == "Austrália":
                      region_query = (
                          '("Australia" OR "Australian" OR "Austrália")'
                      )

                  elif region == "América Latina":
                      region_query = (
                          '("Latin America" OR "Latin American" '
                          'OR "América Latina")'
                      )

                  elif region == "Ásia":
                      region_query = (
                          '("Asia" OR "Asian" OR "Ásia")'
                      )

              if region_query:
                  query = (
                      f"({agro_query} AND {region_query}) "
                      f"sourcelang:{language_code}"
                  )
              else:
                  query = (
                      f"{agro_query} "
                      f"sourcelang:{language_code}"
                  )

              return query


          # ============================================================
          # COLETA
          # ============================================================

          news = []
          seen_urls = set()
          seen_titles = set()

          region_list = list(REGIONS.keys())

          # Também fazemos uma busca global.
          region_list.append("Mundo")

          for region in region_list:

              for language_name, language_code in LANGUAGES.items():

                  print(
                      f"Buscando: {region} | {language_name}"
                  )

                  query = make_query(
                      region,
                      language_code
                  )

                  articles = fetch_gdelt(query)

                  for article in articles:

                      title = str(
                          article.get("title", "")
                      ).strip()

                      url = str(
                          article.get("url", "")
                      ).strip()

                      if not title or not url:
                          continue

                      domain = get_domain(url)

                      if domain in BLOCKED_DOMAINS:
                          continue

                      if contains_bad_script(title):
                          continue

                      if not valid_agro_title(title):
                          continue

                      if not detect_region_from_query(
                          region,
                          title
                      ):
                          continue

                      normalized_title = normalize(title)

                      # Duplicata por título.
                      title_key = re.sub(
                          r"[^a-z0-9]+",
                          " ",
                          normalized_title
                      ).strip()

                      if title_key in seen_titles:
                          continue

                      # Duplicata por URL.
                      if url in seen_urls:
                          continue

                      commodities = detect_commodity(title)

                      if not commodities:
                          commodities = ["Agronegócio"]

                      # Categoria.
                      if any(
                          c in commodities
                          for c in [
                              "Soja",
                              "Milho",
                              "Trigo",
                              "Café",
                              "Cacau",
                              "Açúcar",
                              "Algodão",
                              "Arroz"
                          ]
                      ):
                          category = "Commodities"
                      elif any(
                          c in commodities
                          for c in [
                              "Carne bovina",
                              "Carne de frango",
                              "Carne suína"
                          ]
                      ):
                          category = "Proteína animal"
                      elif "Fertilizantes" in commodities:
                          category = "Insumos"
                      else:
                          category = "Agronegócio"

                      # Impacto simples baseado no conteúdo.
                      normalized = normalize(title)

                      impact = "Neutro"

                      positive_terms = [
                          "increase",
                          "increases",
                          "rise",
                          "rises",
                          "higher",
                          "growth",
                          "surge",
                          "record",
                          "aumento",
                          "alta",
                          "crescimento",
                          "recorde",
                          "subida",
                          "subida de",
                          "aumenta",
                          "aumentam",
                          "aumentó",
                          "crecimiento",
                          "récord",
                      ]

                      negative_terms = [
                          "fall",
                          "falls",
                          "drop",
                          "drops",
                          "decline",
                          "lower",
                          "drought",
                          "flood",
                          "crisis",
                          "queda",
                          "baixa",
                          "redução",
                          "seca",
                          "enchente",
                          "crise",
                          "caída",
                          "descenso",
                          "sequía",
                          "inundación",
                      ]

                      if contains_any(
                          title,
                          positive_terms
                      ):
                          impact = "Alta"

                      if contains_any(
                          title,
                          negative_terms
                      ):
                          impact = "Baixa"

                      # Data do GDELT.
                      date_value = (
                          article.get("seendate")
                          or article.get("date")
                          or datetime.now(
                              timezone.utc
                          ).isoformat()
                      )

                      source = (
                          article.get("domain")
                          or domain
                      )

                      news.append({
                          "id": len(news) + 1,
                          "region": region,
                          "language": language_name,
                          "category": category,
                          "title": title,
                          "summary": "",
                          "commodities": commodities,
                          "impact": impact,
                          "source": source,
                          "url": url,
                          "date": date_value,
                      })

                      seen_titles.add(title_key)
                      seen_urls.add(url)

                  # Pequena pausa para evitar excesso de requisições.
                  time.sleep(0.2)


          # ============================================================
          # ORGANIZAÇÃO
          # ============================================================

          # Prioriza notícias com commodities específicas.
          news.sort(
              key=lambda item: (
                  0 if item["commodities"] == ["Agronegócio"] else -1,
                  item["date"]
              ),
              reverse=True
          )

          # Máximo de 12 por região.
          balanced = []

          for region in region_list:

              regional = [
                  item
                  for item in news
                  if item["region"] == region
              ]

              balanced.extend(
                  regional[:12]
              )

          # Limite global.
          balanced = balanced[:120]

          # Reorganiza IDs.
          for index, item in enumerate(
              balanced,
              start=1
          ):
              item["id"] = index


          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_stats = {}

          region_stats = {}

          commodity_stats = {}

          for item in balanced:

              language = item["language"]

              language_stats[language] = (
                  language_stats.get(language, 0) + 1
              )

              region = item["region"]

              region_stats[region] = (
                  region_stats.get(region, 0) + 1
              )

              for commodity in item["commodities"]:

                  commodity_stats[commodity] = (
                      commodity_stats.get(
                          commodity,
                          0
                      ) + 1
                  )


          # ============================================================
          # SAÍDA
          # ============================================================

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": "GDELT",

              "count": len(balanced),

              "languages": language_stats,

              "regions": region_stats,

              "commodities": commodity_stats,

              "news": balanced
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("=" * 60)
          print("RADAR AGRO — RESULTADO")
          print("=" * 60)
          print(
              f"Total de notícias: {len(balanced)}"
          )
          print(
              f"Idiomas: {language_stats}"
          )
          print(
              f"Regiões: {region_stats}"
          )
          print(
              f"Commodities: {commodity_stats}"
          )
          print("=" * 60)
          PY

          python update_news.py

      - name: Verificar arquivo
        run: |
          python - <<'PY'
          import json

          with open(
              "data/news-live.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("COUNT:", data.get("count"))
          print("LANGUAGES:", data.get("languages"))
          print("REGIONS:", data.get("regions"))
          print("COMMODITIES:", data.get("commodities"))
          PY

      - name: Salvar notícias no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas notícias."
          else
            git commit -m "Atualizar notícias do Radar Agro"
            git push
          fi
