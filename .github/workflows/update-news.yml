name: Atualizar notícias do Radar Agro

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias agro
        shell: bash
        run: |
          cat > update_news.py <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone


          GDELT_URL = "https://api.gdeltproject.org/api/v2/doc/doc"

          LANGUAGES = {
              "English": "english",
              "Portuguese": "portuguese",
              "Spanish": "spanish",
          }

          # Regiões utilizadas pelo Radar Agro.
          # A região é definida pela própria busca, evitando
          # classificações erradas baseadas somente no título.
          REGIONS = {
              "Brasil": [
                  "Brazil", "Brasil", "Brazilian", "Brasileiro",
                  "Brasileira", "Brasília", "Sao Paulo", "São Paulo",
                  "Mato Grosso", "Parana", "Paraná", "Goiás", "Minas Gerais"
              ],

              "África": [
                  "Africa", "African", "África", "Africano",
                  "Africana", "Nigeria", "Kenya", "Ethiopia",
                  "South Africa", "Ghana", "Zambia", "Zimbabwe",
                  "Tanzania", "Uganda", "Mozambique", "Angola",
                  "Senegal", "Ivory Coast", "Côte d'Ivoire",
                  "Cameroon", "Benin", "Mali", "Burkina Faso"
              ],

              "Estados Unidos": [
                  "United States", "USA", "US", "America",
                  "American", "Estados Unidos", "Iowa", "Illinois",
                  "Kansas", "Texas", "Nebraska", "Minnesota"
              ],

              "China": [
                  "China", "Chinese", "Beijing", "Shanghai",
                  "Guangdong", "Shandong", "Heilongjiang"
              ],

              "Argentina": [
                  "Argentina", "Argentine", "Buenos Aires",
                  "Cordoba", "Córdoba", "Rosario"
              ],

              "Índia": [
                  "India", "Indian", "New Delhi", "Delhi",
                  "Mumbai", "Maharashtra", "Punjab"
              ],

              "Europa": [
                  "Europe", "European", "European Union", "EU",
                  "France", "Germany", "Spain", "Italy",
                  "Portugal", "Netherlands", "Poland", "Ukraine",
                  "United Kingdom", "UK", "Romania"
              ],

              "Rússia / Ucrânia": [
                  "Russia", "Russian", "Ukraine", "Ukrainian",
                  "Moscow", "Kyiv", "Kiev", "Black Sea"
              ],

              "Austrália": [
                  "Australia", "Australian", "Queensland",
                  "New South Wales", "Victoria", "Western Australia"
              ],

              "Oriente Médio": [
                  "Middle East", "Gulf", "Saudi Arabia",
                  "United Arab Emirates", "UAE", "Qatar",
                  "Iran", "Iraq", "Israel", "Jordan",
                  "Egypt", "Red Sea", "Suez"
              ],

              "América Latina": [
                  "Latin America", "Mexico", "Chile", "Colombia",
                  "Peru", "Paraguay", "Uruguay", "Bolivia",
                  "Ecuador", "Central America"
              ]
          }


          AGRO_TERMS = [
              # Inglês
              "agriculture", "agricultural", "farmer", "farmers",
              "farming", "crop", "crops", "harvest", "planting",
              "soybean", "soybeans", "soy", "corn", "maize",
              "wheat", "coffee", "cocoa", "cacao", "sugar",
              "cotton", "rice", "beef", "cattle", "livestock",
              "poultry", "pork", "fertilizer", "fertiliser",
              "grain", "grains", "food security", "food supply",
              "agricultural exports", "agricultural imports",
              "commodity", "commodities", "grain market",
              "farm prices", "crop prices", "drought",
              "flood", "flooding", "weather", "rainfall",
              "El Niño", "La Niña", "trade", "export", "exports",
              "import", "imports", "tariff", "tariffs",
              "port", "ports", "logistics", "shipping",

              # Português
              "agricultura", "agrícola", "agricultor", "agricultores",
              "agropecuária", "agronegócio", "lavoura", "safra",
              "plantio", "colheita", "soja", "milho", "trigo",
              "café", "cacau", "açúcar", "algodão", "arroz",
              "carne bovina", "bovinos", "gado", "pecuária",
              "frango", "suínos", "fertilizante", "fertilizantes",
              "grãos", "segurança alimentar", "commodities",
              "exportação", "exportações", "importação", "importações",
              "tarifa", "tarifas", "porto", "portos", "logística",
              "chuva", "chuvas", "seca", "enchente", "clima",
              "preço", "preços", "mercado agrícola",

              # Espanhol
              "agricultura", "agrícola", "agricultor", "agricultores",
              "agropecuario", "agropecuaria", "agronegocio",
              "cultivo", "cosecha", "siembra", "soja", "maíz",
              "trigo", "café", "cacao", "azúcar", "algodón",
              "arroz", "carne bovina", "ganado", "ganadería",
              "pollo", "cerdo", "fertilizante", "fertilizantes",
              "granos", "seguridad alimentaria", "materias primas",
              "commodities", "exportación", "exportaciones",
              "importación", "importaciones", "arancel", "aranceles",
              "puerto", "puertos", "logística", "lluvia",
              "sequía", "inundación", "clima", "precio", "precios",
              "mercado agrícola"
          ]


          COMMODITIES = {
              "Soja": [
                  "soybean", "soybeans", "soy", "soja"
              ],
              "Milho": [
                  "corn", "maize", "milho", "maíz"
              ],
              "Trigo": [
                  "wheat", "trigo"
              ],
              "Café": [
                  "coffee", "café"
              ],
              "Cacau": [
                  "cocoa", "cacao", "cacau"
              ],
              "Açúcar": [
                  "sugar", "açúcar", "azúcar"
              ],
              "Algodão": [
                  "cotton", "algodão", "algodón"
              ],
              "Arroz": [
                  "rice", "arroz"
              ],
              "Carne bovina": [
                  "beef", "cattle", "livestock",
                  "carne bovina", "gado", "bovinos", "ganado"
              ],
              "Frango": [
                  "poultry", "chicken", "frango", "pollo"
              ],
              "Suínos": [
                  "pork", "pig", "pigs", "suínos", "porco", "cerdo"
              ],
              "Fertilizantes": [
                  "fertilizer", "fertiliser",
                  "fertilizante", "fertilizantes"
              ]
          }


          # Bloqueio adicional por caracteres.
          # Isso impede que títulos em alfabetos claramente incompatíveis
          # entrem mesmo que o GDELT tenha classificado o idioma incorretamente.
          def contains_forbidden_script(text):
              if not text:
                  return True

              # Chinês
              if re.search(r"[\u4e00-\u9fff]", text):
                  return True

              # Japonês
              if re.search(r"[\u3040-\u30ff]", text):
                  return True

              # Coreano
              if re.search(r"[\uac00-\ud7af]", text):
                  return True

              # Árabe
              if re.search(r"[\u0600-\u06ff]", text):
                  return True

              # Devanágari / hindi
              if re.search(r"[\u0900-\u097f]", text):
                  return True

              # Cirílico
              if re.search(r"[\u0400-\u04ff]", text):
                  return True

              # Grego
              if re.search(r"[\u0370-\u03ff]", text):
                  return True

              return False


          def normalize_text(text):
              text = (text or "").lower()
              text = re.sub(r"\s+", " ", text)
              return text.strip()


          def contains_agro_term(title):
              t = normalize_text(title)
              return any(term.lower() in t for term in AGRO_TERMS)


          def detect_commodity(title):
              t = normalize_text(title)

              for commodity, terms in COMMODITIES.items():
                  for term in terms:
                      if term.lower() in t:
                          return commodity

              return "Agro geral"


          def make_query(region, language_code):
              region_terms = REGIONS[region]

              region_part = " OR ".join(
                  f'"{term}"' for term in region_terms[:10]
              )

              agro_part = (
                  '"agriculture" OR "agricultural" OR "agro" OR '
                  '"soybean" OR "corn" OR "wheat" OR "coffee" OR '
                  '"cocoa" OR "sugar" OR "cotton" OR "rice" OR '
                  '"beef" OR "cattle" OR "fertilizer" OR '
                  '"agricultura" OR "agrícola" OR "agronegócio" OR '
                  '"soja" OR "milho" OR "trigo" OR "café" OR '
                  '"cacau" OR "açúcar" OR "algodão" OR "arroz" OR '
                  '"gado" OR "fertilizante" OR '
                  '"agricultura" OR "agrícola" OR "soja" OR '
                  '"maíz" OR "trigo" OR "café" OR "cacao" OR '
                  '"azúcar" OR "algodón" OR "arroz"'
              )

              return f"({region_part}) AND ({agro_part}) AND sourcelang:{language_code}"


          def fetch_region_language(region, language_name, language_code):
              query = make_query(region, language_code)

              params = {
                  "query": query,
                  "mode": "artlist",
                  "maxrecords": 30,
                  "format": "json",
                  "timespan": "7d",
                  "sort": "datedesc"
              }

              url = GDELT_URL + "?" + urllib.parse.urlencode(params)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Radar-Agro-Global/1.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  articles = data.get("articles", [])

                  results = []

                  for article in articles:
                      title = (article.get("title") or "").strip()

                      if not title:
                          continue

                      # O idioma retornado pelo GDELT também precisa ser permitido.
                      gdelt_language = article.get("language", "")

                      if gdelt_language not in LANGUAGES:
                          continue

                      # O idioma da busca e o idioma informado pelo GDELT
                      # precisam ser o mesmo.
                      if gdelt_language != language_name:
                          continue

                      # Bloqueia alfabetos que não queremos.
                      if contains_forbidden_script(title):
                          continue

                      # O título precisa ter relação com agro.
                      if not contains_agro_term(title):
                          continue

                      url_article = (article.get("url") or "").strip()

                      if not url_article:
                          continue

                      source = (
                          article.get("domain")
                          or article.get("sourcecountry")
                          or "Fonte não informada"
                      )

                      date = article.get("seendate", "")

                      commodity = detect_commodity(title)

                      results.append({
                          "region": region,
                          "commodity": commodity,
                          "language": language_name,
                          "title": title,
                          "url": url_article,
                          "source": source,
                          "date": date
                      })

                  return results

              except Exception as exc:
                  print(
                      f"Erro em {region} / {language_name}: {exc}"
                  )
                  return []


          def title_key(title):
              t = normalize_text(title)

              # Remove pontuação para encontrar matérias
              # praticamente iguais publicadas em sites diferentes.
              t = re.sub(r"[^a-z0-9áéíóúãõâêôçñü ]+", " ", t)
              t = re.sub(r"\s+", " ", t)

              return t[:300]


          def main():
              tasks = []

              for region in REGIONS:
                  for language_name, language_code in LANGUAGES.items():
                      tasks.append(
                          (region, language_name, language_code)
                      )

              all_results = []

              # Execução paralela para acelerar as buscas.
              with ThreadPoolExecutor(max_workers=12) as executor:
                  futures = [
                      executor.submit(
                          fetch_region_language,
                          region,
                          language_name,
                          language_code
                      )
                      for region, language_name, language_code in tasks
                  ]

                  for future in as_completed(futures):
                      try:
                          all_results.extend(future.result())
                      except Exception as exc:
                          print("Erro geral:", exc)

              # Deduplicação por título normalizado.
              unique = {}

              for item in all_results:
                  key = title_key(item["title"])

                  if not key:
                      continue

                  if key not in unique:
                      unique[key] = item

              news = list(unique.values())

              # Ordenação por data.
              news.sort(
                  key=lambda x: x.get("date", ""),
                  reverse=True
              )

              # Limite por região para manter equilíbrio no Radar.
              max_per_region = 20

              final_news = []
              region_count = {}

              for item in news:
                  region = item["region"]

                  if region_count.get(region, 0) >= max_per_region:
                      continue

                  region_count[region] = region_count.get(region, 0) + 1
                  final_news.append(item)

              # Máximo global.
              final_news = final_news[:150]

              output = {
                  "updated": datetime.now(
                      timezone.utc
                  ).isoformat(),

                  "source": "GDELT",

                  "count": len(final_news),

                  "languages": [
                      "English",
                      "Portuguese",
                      "Spanish"
                  ],

                  "regions": list(REGIONS.keys()),

                  "news": final_news
              }

              with open(
                  "data/news-live.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      output,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  f"Total de notícias válidas: {len(final_news)}"
              )

              print(
                  "Distribuição por região:"
              )

              for region, count in sorted(
                  region_count.items()
              ):
                  print(
                      f"  {region}: {count}"
                  )


          if __name__ == "__main__":
              main()
          PY

          python update_news.py

      - name: Salvar notícias atualizadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar notícias agro automaticamente"
            git push
          fi
