                  "chinese agriculture",
                  "chinese farmers",
                  "china soybean",
                  "china corn",
                  "china wheat",
                  "china imports",
                  "chinese imports"
              ],

              "Argentina": [
                  "argentina",
                  "argentine",
                  "argentinean",
                  "argentine agriculture",
                  "argentine farmers",
                  "argentine soybean",
                  "argentine corn",
                  "argentine wheat"
              ],

              "Índia": [
                  "india",
                  "indian",
                  "indian agriculture",
                  "indian farmers",
                  "india soybean",
                  "india wheat",
                  "india rice",
                  "india sugar",
                  "indian sugar"
              ],

              "Europa": [
                  "europe",
                  "european",
                  "european union",
                  "eu agriculture",
                  "eu farmers",
                  "european agriculture",
                  "eu agricultural"
              ],

              "Rússia e Ucrânia": [
                  "russia",
                  "russian",
                  "ukraine",
                  "ukrainian",
                  "black sea grain",
                  "black sea agriculture",
                  "russian wheat",
                  "ukrainian grain",
                  "ukraine grain exports",
                  "russia grain exports"
              ],

              "Austrália": [
                  "australia",
                  "australian",
                  "australian agriculture",
                  "australian farmers",
                  "australian wheat",
                  "australian grain"
              ],

              "Oriente Médio": [
                  "middle east",
                  "middle eastern",
                  "gulf",
                  "gulf countries",
                  "saudi arabia",
                  "iran",
                  "iraq",
                  "israel",
                  "united arab emirates",
                  "uae",
                  "qatar",
                  "jordan",
                  "yemen",
                  "oman"
              ],

              "América Latina": [
                  "latin america",
                  "latin american",
                  "mexico",
                  "mexican",
                  "colombia",
                  "colombian",
                  "chile",
                  "chilean",
                  "peru",
                  "peruvian",
                  "paraguay",
                  "uruguay",
                  "bolivia",
                  "ecuador",
                  "central america"
              ]
          }

          # ============================================================
          # TERMOS MUITO GENÉRICOS QUE NÃO DEVEM SER SUFICIENTES
          # SOZINHOS PARA CLASSIFICAR UMA NOTÍCIA COMO AGRO
          # ============================================================

          WEAK_AGRO_TERMS = {
              "commodity",
              "commodities",
              "grain",
              "grains",
              "export",
              "exports",
              "import",
              "imports",
              "food",
              "food security",
              "drought",
              "flood",
              "flooding"
          }

          # ============================================================
          # FUNÇÕES
          # ============================================================

          def normalize(text):
              text = str(text or "").lower()
              text = text.replace("&amp;", " and ")
              text = re.sub(r"\s+", " ", text)
              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              return text.strip()

          def contains_forbidden_script(text):
              if not text:
                  return True

              # Chinês / japonês
              if re.search(r"[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]", text):
                  return True

              # Coreano
              if re.search(r"[\uac00-\ud7af]", text):
                  return True

              # Árabe
              if re.search(r"[\u0600-\u06ff]", text):
                  return True

              # Hebraico
              if re.search(r"[\u0590-\u05ff]", text):
                  return True

              # Cirílico
              if re.search(r"[\u0400-\u04ff]", text):
                  return True

              # Grego
              if re.search(r"[\u0370-\u03ff]", text):
                  return True

              # Devanagari
              if re.search(r"[\u0900-\u097f]", text):
                  return True

              # Bengali
              if re.search(r"[\u0980-\u09ff]", text):
                  return True

              # Gujarati
              if re.search(r"[\u0a80-\u0aff]", text):
                  return True

              # Thai
              if re.search(r"[\u0e00-\u0e7f]", text):
                  return True

              return False

          def detect_agro_strength(title):
              normalized = normalize(title)

              strong_terms = []

              for term in AGRO_TERMS:
                  t = normalize(term)

                  if len(t) < 4:
                      continue

                  if t in normalized and t not in WEAK_AGRO_TERMS:
                      strong_terms.append(t)

              return strong_terms

          def detect_commodity(title):
              normalized = normalize(title)

              found = []

              for commodity, terms in COMMODITIES.items():

                  for term in terms:

                      t = normalize(term)

                      if t and t in normalized:
                          found.append(commodity)
                          break

              return found

          def detect_region(title):
              normalized = normalize(title)

              candidates = []

              for region, terms in REGION_TERMS.items():

                  score = 0

                  for term in terms:

                      t = normalize(term)

                      if len(t) < 4:
                          continue

                      if t in normalized:

                          # País específico vale mais que termos genéricos.
                          if len(t.split()) >= 2:
                              score += 3
                          else:
                              score += 1

                  if score > 0:
                      candidates.append((score, region))

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              return candidates[0][1]

          def normalize_title(title):
              title = normalize(title)

              stopwords = {
                  "the", "a", "an", "of", "and", "to",
                  "in", "on", "for", "with",
                  "o", "a", "os", "as", "de", "da", "do",
                  "e", "para", "em", "com",
                  "el", "la", "los", "las", "de",
                  "del", "y", "en", "con"
              }

              words = [
                  word
                  for word in title.split()
                  if word not in stopwords
              ]

              return " ".join(words)

          def title_fingerprint(title):
              normalized = normalize_title(title)

              # Retira números que costumam variar em títulos
              normalized = re.sub(r"\b\d+\b", " ", normalized)

              # Remove espaços duplicados
              normalized = re.sub(r"\s+", " ", normalized)

              return normalized.strip()

          # ============================================================
          # GDELT
          # ============================================================

          def fetch_gdelt(query):

              encoded = urllib.parse.quote(query)

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc"
                  f"?query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=50"
                  "&timespan=3d"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadarAgroGlobal/2.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read().decode("utf-8")

                  return json.loads(raw)

              except Exception as error:

                  print("Erro GDELT:", error)

                  return {
                      "articles": []
                  }

          # ============================================================
          # CONSULTAS
          # ============================================================

          region_queries = {

              "Brasil": [
                  '"Brazil" agriculture',
                  '"Brazil" soybean',
                  '"Brazil" corn',
                  '"Brazil" coffee',
                  '"Brazil" cattle',
                  '"Brazil" fertilizer',
                  '"Brasil" agricultura',
                  '"Brasil" soja',
                  '"Brasil" milho',
                  '"Brasil" café',
                  '"Brasil" pecuária'
              ],

              "África": [
                  '"Africa" agriculture',
                  '"Africa" farming',
                  '"Africa" crops',
                  '"Africa" cocoa',
                  '"Africa" cotton',
                  '"Africa" food security',
                  '"Africa" fertilizer',
                  '"Nigeria" agriculture',
                  '"Kenya" agriculture',
                  '"Ethiopia" agriculture',
                  '"Ghana" agriculture',
                  '"South Africa" agriculture'
              ],

              "Estados Unidos": [
                  '"United States" agriculture',
                  '"US" soybean',
                  '"US" corn',
                  '"US" wheat',
                  '"American farmers" agriculture',
                  '"US agriculture" commodities'
              ],

              "China": [
                  '"China" agriculture',
                  '"China" soybean',
                  '"China" corn',
                  '"China" wheat',
                  '"China" agricultural imports',
                  '"Chinese farmers" agriculture'
              ],

              "Argentina": [
                  '"Argentina" agriculture',
                  '"Argentina" soybean',
                  '"Argentina" corn',
                  '"Argentina" wheat',
                  '"Argentine farmers"'
              ],

              "Índia": [
                  '"India" agriculture',
                  '"India" soybean',
                  '"India" wheat',
                  '"India" rice',
                  '"India" sugar',
                  '"Indian farmers"'
              ],

              "Europa": [
                  '"European Union" agriculture',
                  '"Europe" farmers',
                  '"European agriculture"',
                  '"EU agricultural exports"'
              ],

              "Rússia e Ucrânia": [
                  '"Russia" agriculture',
                  '"Russia" wheat',
                  '"Russia" grain exports',
                  '"Ukraine" agriculture',
                  '"Ukraine" grain',
                  '"Ukraine" grain exports',
                  '"Black Sea" grain'
              ],

              "Austrália": [
                  '"Australia" agriculture',
                  '"Australian farmers"',
                  '"Australia" wheat',
                  '"Australia" grain'
              ],

              "Oriente Médio": [
                  '"Middle East" agriculture',
                  '"Middle East" food security',
                  '"Middle East" grain',
                  '"Saudi Arabia" agriculture',
                  '"Iran" agriculture',
                  '"UAE" agriculture'
              ],

              "América Latina": [
                  '"Latin America" agriculture',
                  '"Latin America" soybean',
                  '"Mexico" agriculture',
                  '"Colombia" agriculture',
                  '"Paraguay" agriculture',
                  '"Uruguay" agriculture',
                  '"Chile" agriculture'
              ]
          }

          # ============================================================
          # COLETA
          # ============================================================

          collected = []

          for region, queries in region_queries.items():

              for language_name, language_code in LANGUAGES.items():

                  for base_query in queries:

                      query = (
                          f"({base_query}) "
                          f"sourcelang:{language_code}"
                      )

                      print(
                          "Buscando:",
                          region,
                          language_name,
                          query
                      )

                      data = fetch_gdelt(query)

                      articles = data.get(
                          "articles",
                          []
                      )

                      for article in articles:

                          title = str(
                              article.get(
                                  "title",
                                  ""
                              )
                          ).strip()

                          url = str(
                              article.get(
                                  "url",
                                  ""
                              )
                          ).strip()

                          source = str(
                              article.get(
                                  "domain",
                                  ""
                              )
                          ).strip()

                          date = str(
                              article.get(
                                  "seendate",
                                  ""
                              )
                          ).strip()

                          gdelt_language = str(
                              article.get(
                                  "language",
                                  ""
                              )
                          ).strip()

                          if not title or not url:
                              continue

                          # ==================================================
                          # IDIOMA
                          # ==================================================

                          # Se GDELT informar um idioma diferente,
                          # rejeitamos imediatamente.
                          if gdelt_language:

                              allowed_gdelt_languages = {
                                  "English",
                                  "Portuguese",
                                  "Spanish"
                              }

                              if gdelt_language not in allowed_gdelt_languages:
                                  continue

                          # Bloqueia alfabetos incompatíveis.
                          if contains_forbidden_script(title):
                              continue

                          # ==================================================
                          # AGRO
                          # ==================================================

                          agro_matches = detect_agro_strength(title)

                          # Precisa haver pelo menos um termo agro forte.
                          if not agro_matches:
                              continue

                          # ==================================================
                          # REGIÃO
                          # ==================================================

                          detected_region = detect_region(title)

                          if detected_region != region:
                              continue

                          # ==================================================
                          # COMMODITY
                          # ==================================================

                          commodities = detect_commodity(title)

                          # ==================================================
                          # PONTUAÇÃO
                          # ==================================================

                          score = 0

                          score += len(agro_matches) * 2

                          score += len(commodities) * 3

                          if len(title) > 40:
                              score += 1

                          if len(title) > 80:
                              score += 1

                          # ==================================================
                          # CHAVE
                          # ==================================================

                          fingerprint = title_fingerprint(title)

                          if not fingerprint:
                              continue

                          collected.append({
                              "region": region,
                              "title": title,
                              "url": url,
                              "source": source,
                              "date": date,
                              "language": language_name,
                              "commodities": commodities,
                              "_score": score,
                              "_key": fingerprint
                          })

          # ============================================================
          # DEDUPLICAÇÃO
          # ============================================================

          unique = {}

          for item in collected:

              key = item["_key"]

              if key not in unique:

                  unique[key] = item

              else:

                  # Se for a mesma notícia publicada em vários sites,
                  # mantém a versão com maior pontuação.
                  if item["_score"] > unique[key]["_score"]:

                      unique[key] = item

          news = list(
              unique.values()
          )

          # ============================================================
          # ORDENAR
          # ============================================================

          news.sort(
              key=lambda item: (
                  item.get("_score", 0),
                  item.get("date", "")
              ),
              reverse=True
          )

          # ============================================================
          # LIMITE POR REGIÃO
          # ============================================================

          balanced = []

          region_limits = {}

          for item in news:

              region = item["region"]

              current = region_limits.get(
                  region,
                  0
              )

              if current >= 15:
                  continue

              balanced.append(item)

              region_limits[region] = current + 1

          news = balanced[:150]

          # ============================================================
          # REMOVER CAMPOS INTERNOS
          # ============================================================

          for item in news:

              item.pop(
                  "_score",
                  None
              )

              item.pop(
                  "_key",
                  None
              )

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          language_count = {}
          region_count = {}

          for item in news:

              language = item.get(
                  "language",
                  "Unknown"
              )

              region = item.get(
                  "region",
                  "Unknown"
              )

              language_count[language] = (
                  language_count.get(
                      language,
                      0
                  ) + 1
              )

              region_count[region] = (
                  region_count.get(
                      region,
                      0
                  ) + 1
              )

          # ============================================================
          # SALVAR
          # ============================================================

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": "GDELT",

              "count": len(news),

              "languages": language_count,

              "regions": region_count,

              "news": news
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("======================================")
          print("RADAR AGRO ATUALIZADO")
          print("Total:", len(news))
          print("Idiomas:", language_count)
          print("Regiões:", region_count)
          print("======================================")

      - name: Verificar arquivo
        run: |
          echo "Conteúdo inicial do arquivo:"
          head -80 data/news-live.json

      - name: Salvar alterações
        run: |
          git config user.name "Radar Agro Global"
          git config user.email "radaragroglobal@users.noreply.github.com"

          git add data/news-live.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar notícias agro automaticamente"
            git push
          fi
