name: Atualizar notícias do Radar Agro

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-agro-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        shell: python
        run: |

          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from html import unescape


          OUTPUT = "data/news-live.json"


          # ========================================================
